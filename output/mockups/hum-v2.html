<style>
  :root {
    --color-paper:   oklch(97% 0.012 95);
    --color-paper-2: oklch(94% 0.016 95);
    --color-paper-3: oklch(91% 0.020 95);
    --color-ink:     oklch(20% 0.012 250);
    --color-ink-2:   oklch(32% 0.010 250);
    --color-muted:   oklch(48% 0.010 250);
    --color-accent:      oklch(86% 0.18 95);
    --color-accent-deep: oklch(66% 0.16 85);
    --color-accent-2:    oklch(66% 0.18 235);
    --color-accent-2-deep: oklch(50% 0.15 235);
    --color-accent-3:    oklch(68% 0.24 18);
    --color-focus:   oklch(55% 0.17 247);
    --font-body: "Plus Jakarta Sans", ui-sans-serif, "PingFang TC", "Noto Sans TC", "Noto Sans SC", sans-serif;
    --font-label: "JetBrains Mono", ui-monospace, monospace;
    --radius-card: 20px; --radius-pill: 999px;
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-snap: cubic-bezier(0.22, 1, 0.36, 1);
    --page-gutter: clamp(1.25rem, 4vw, 3rem);
    --shell: 46rem;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; margin: 0; padding: 0; }
  body { background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-feature-settings: "ss01" on; }
  .mono { font-family: var(--font-label); }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
  .shell { max-width: var(--shell); margin-inline: auto; padding-inline: var(--page-gutter); position: relative; }

  /* language switcher */
  .lang-switcher { position: absolute; top: 2.25rem; right: var(--page-gutter); }
  .lang-btn {
    display: inline-flex; align-items: center; gap: 0.4em;
    background: var(--color-paper-2); border: none; border-radius: var(--radius-pill);
    padding: 0.5em 0.9em; font-family: var(--font-label); font-size: 0.72rem; letter-spacing: 0.04em;
    color: var(--color-ink-2); cursor: pointer;
  }
  .lang-btn:hover { background: var(--color-paper-3); }
  .lang-menu {
    position: absolute; top: calc(100% + 0.4rem); right: 0; z-index: 30;
    background: var(--color-paper); border-radius: 14px; box-shadow: 0 12px 32px -12px oklch(20% 0.012 250 / 0.25);
    padding: 0.4rem; min-width: 9rem; display: none;
  }
  .lang-menu.is-open { display: block; }
  .lang-option {
    display: flex; width: 100%; text-align: left; align-items: center; gap: 0.5em;
    background: none; border: none; border-radius: 10px; padding: 0.5em 0.7em;
    font-family: var(--font-body); font-size: 0.85rem; color: var(--color-ink); cursor: pointer;
  }
  .lang-option:hover { background: var(--color-paper-2); }
  .lang-option[aria-checked="true"] { font-weight: 600; color: var(--color-accent-2-deep); }
  .lang-note {
    display: none; margin: 0 0 1.5rem; padding: 0.6em 1em; background: var(--color-paper-2);
    border-radius: 12px; font-size: 0.82rem; color: var(--color-ink-2);
  }
  html[data-lang="zh-Hans"] .lang-note, html[data-lang="en"] .lang-note { display: block; }

  .masthead { padding: 3.5rem 0 1.5rem; display: flex; align-items: flex-start; gap: 1rem; padding-right: 8rem; }
  .mascot { width: 44px; height: 44px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; margin-top: 0.35rem; animation: mascot-pulse 4s ease-in-out infinite; }
  @keyframes mascot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .masthead h1 { margin: 0; font-size: clamp(1.9rem, 3vw + 1rem, 2.75rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; max-width: 22ch; overflow-wrap: anywhere; }
  .masthead-meta { margin-top: 0.6rem; color: var(--color-muted); }
  .masthead-meta .mono { font-size: 0.75rem; letter-spacing: 0.06em; opacity: 0.85; }

  .streak {
    display: flex; align-items: center; gap: 0.9rem;
    background: var(--color-paper-2); border-radius: var(--radius-pill);
    padding: 0.55rem 1.1rem 0.55rem 0.6rem; margin-bottom: 2.5rem; width: fit-content;
  }
  .streak-track { width: 90px; height: 6px; border-radius: 3px; background: var(--color-paper-3); overflow: hidden; }
  .streak-fill { height: 100%; width: 0%; background: var(--color-accent-3); border-radius: 3px; transition: width 420ms var(--ease-snap); }
  .streak .mono { font-size: 0.72rem; letter-spacing: 0.04em; }

  .topic {
    border-radius: var(--radius-card); margin-bottom: 1.1rem; overflow: hidden;
    box-shadow: 0 10px 28px -16px oklch(20% 0.012 250 / 0.14);
  }
  .topic--pear { background: color-mix(in oklch, var(--color-accent) 12%, var(--color-paper)); }
  .topic--cyan { background: color-mix(in oklch, var(--color-accent-2) 10%, var(--color-paper)); }

  .topic-head { padding: clamp(1.25rem, 3vw, 1.75rem); cursor: pointer; }
  .topic-kicker-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.8rem; }
  .topic-kicker { font-family: var(--font-label); font-size: 0.68rem; letter-spacing: 0.08em; padding: 0.3em 0.8em; border-radius: var(--radius-pill); }
  .topic--pear .topic-kicker { background: var(--color-accent); color: var(--color-ink); }
  .topic--cyan .topic-kicker { background: var(--color-accent-2); color: var(--color-paper); }

  .topic-stamp {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    border: 2px dashed color-mix(in oklch, var(--color-ink) 25%, transparent);
    display: flex; align-items: center; justify-content: center; opacity: 0.55;
    transition: all 320ms var(--ease-spring);
  }
  .topic-stamp svg { width: 13px; height: 13px; opacity: 0; transform: scale(0.4); transition: all 320ms var(--ease-spring); }
  .topic.is-collected .topic-stamp { opacity: 1; border-style: solid; border-color: var(--color-accent-3); background: color-mix(in oklch, var(--color-accent-3) 14%, transparent); transform: rotate(-8deg) scale(1.08); }
  .topic.is-collected .topic-stamp svg { opacity: 1; transform: scale(1); color: var(--color-accent-3); }

  .topic h2 { margin: 0 0 0.55rem; font-size: clamp(1.25rem, 1.7vw + 0.9rem, 1.7rem); font-weight: 700; line-height: 1.3; letter-spacing: -0.012em; overflow-wrap: anywhere; }
  .topic-teaser { margin: 0 0 1.1rem; font-size: 1rem; line-height: 1.6; color: var(--color-ink-2); max-width: 56ch; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.3rem; }
  .stat-tile { background: var(--color-paper); border-radius: 12px; padding: 0.55rem 0.85rem; box-shadow: 0 5px 14px -10px oklch(20% 0.012 250 / 0.18); }
  .stat-value { display: block; font-weight: 700; font-size: clamp(1.1rem, 1.6vw + 0.5rem, 1.4rem); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .stat-label { display: block; margin-top: 0.1rem; font-family: var(--font-label); font-size: 0.6rem; letter-spacing: 0.05em; color: var(--color-muted); }

  .expand-toggle {
    display: inline-flex; align-items: center; gap: 0.4em; margin-top: 1rem;
    background: none; border: none; padding: 0; font-family: var(--font-label);
    font-size: 0.75rem; letter-spacing: 0.05em; color: var(--color-ink-2); cursor: pointer;
  }
  .expand-toggle .chevron { transition: transform 220ms var(--ease-snap); display: inline-block; }
  .topic.is-open .expand-toggle .chevron { transform: rotate(180deg); }

  .topic-panel { max-height: 0; overflow: hidden; transition: max-height 420ms var(--ease-snap); }
  .topic.is-open .topic-panel { max-height: 4000px; }
  .topic-panel-inner { padding: 0 clamp(1.25rem, 3vw, 1.75rem) clamp(1.25rem, 3vw, 1.75rem); }
  .topic-body { background: var(--color-paper); border-radius: 14px; padding: 1.25rem 1.5rem; }
  .topic-section { margin-bottom: 1.1rem; }
  .topic-section:last-child { margin-bottom: 0; }
  .topic-section .run-in { display: block; font-family: var(--font-label); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--color-muted); margin-bottom: 0.5em; }
  .topic-section p { margin: 0 0 0.6rem; font-size: 0.96rem; line-height: 1.66; }
  .topic-section p:last-child { margin-bottom: 0; }

  .delta-insight { margin-top: 1rem; padding: 1rem 1.25rem; background: color-mix(in oklch, var(--color-accent-3) 8%, var(--color-paper)); border-radius: 14px; }
  .delta-insight .run-in { color: color-mix(in oklch, var(--color-accent-3) 70%, var(--color-ink)); }
  .delta-insight p { margin: 0 0 0.6rem; font-size: 0.96rem; line-height: 1.66; }
  .delta-insight p:last-child { margin-bottom: 0; }

  .source-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.4em; font-size: 0.76rem; font-weight: 600;
    text-decoration: none; padding: 0.5rem 0.95rem; border-radius: var(--radius-pill);
    background: var(--color-paper); color: var(--color-ink); cursor: pointer; border: none;
    box-shadow: 0 3px 0 0 var(--color-accent-deep), 0 4px 10px -4px oklch(20% 0.012 250 / 0.25);
    transition: transform 140ms var(--ease-spring), box-shadow 140ms var(--ease-spring);
  }
  .topic--cyan .btn { box-shadow: 0 3px 0 0 var(--color-accent-2-deep), 0 4px 10px -4px oklch(20% 0.012 250 / 0.25); }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 0 var(--color-accent-deep); }
  .btn--stamp { background: var(--color-accent-3); color: var(--color-paper); font-weight: 700; box-shadow: 0 3px 0 0 oklch(48% 0.20 18), 0 4px 10px -4px oklch(20% 0.012 250 / 0.3); }
  .btn--stamp:active { box-shadow: 0 1px 0 0 oklch(48% 0.20 18); }
  .topic.is-collected .btn--stamp { background: var(--color-paper-3); color: var(--color-muted); box-shadow: none; pointer-events: none; }

  .star-burst { position: absolute; width: 22px; height: 22px; pointer-events: none;
    background: linear-gradient(90deg, transparent 47%, var(--color-accent-3) 47% 53%, transparent 53%),
                linear-gradient(0deg,  transparent 47%, var(--color-accent-3) 47% 53%, transparent 53%);
    animation: star-burst 420ms ease-out forwards;
  }
  @keyframes star-burst { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 60% { transform: scale(1.2) rotate(35deg); opacity: 0.9; } 100% { transform: scale(1.4) rotate(45deg); opacity: 0; } }

  .foot { padding: 2.5rem 0 4rem; color: var(--color-muted); font-size: 0.8rem; line-height: 1.7; }

  @media (prefers-reduced-motion: reduce) {
    .mascot { animation: none; }
    .topic-panel, .expand-toggle .chevron, .topic-stamp, .topic-stamp svg, .btn { transition-duration: 1ms !important; }
    .star-burst { display: none; }
  }
  @media (max-width: 30rem) {
    .masthead { gap: 0.75rem; padding-right: 5rem; }
    .lang-switcher { top: 1.75rem; }
    .topic-head, .topic-panel-inner { padding-left: 1.1rem; padding-right: 1.1rem; }
  }
</style>
</head>

<script>
const I18N = {
  "zh-Hant": { metaRange: "2026-07-19 – 2026-07-25 · 7 篇精選", progress: n => `已收集 ${n} / 7 枚印章`, expand: "閱讀全文", collapse: "收合", stamp: "讀完了，蓋章", stamped: "已收集 ✓", source: "來源", footerNote: "內容由 AI 依公開來源改寫產出，經事實查核與風格審查關卡後發布，非原文轉載。僅供台達內部參考。", langNote: "" },
  "zh-Hans": { metaRange: "2026-07-19 – 2026-07-25 · 7 篇精选", progress: n => `已收集 ${n} / 7 枚印章`, expand: "阅读全文", collapse: "收起", stamp: "读完了，盖章", stamped: "已收集 ✓", source: "来源", footerNote: "内容由 AI 依据公开来源改写产出，经事实查核与风格审查关卡后发布，非原文转载。仅供台达内部参考。", langNote: "文章内文目前仅提供繁体中文版本。" },
  "en": { metaRange: "Jul 19 – Jul 25, 2026 · 7 picks", progress: n => `${n} / 7 collected`, expand: "Read full article", collapse: "Collapse", stamp: "Mark as read", stamped: "Collected ✓", source: "Sources", footerNote: "Content is AI-rewritten from public sources, fact-checked and style-reviewed before publishing. Not a verbatim reprint. Delta internal use only.", langNote: "Article body copy is currently available in Traditional Chinese only." }
};
const LANG_LABEL = { "zh-Hant": "繁體中文", "zh-Hans": "简体中文", "en": "English" };

const TOPICS = [
  {"content_type":"insight","chosen_headline":"每月處理 7000 億 Token：AT&T 如何用 530 張 GPU 打造電信專屬 AI","card_summary":{"text":"AT&T 透過 Microsoft Foundry 與 530 張混合 GPU 算力，打造每月處理數千億 Token 的電信專屬 AI 模型。"},"stats":[{"value":"700B+","label":"Phi-4 每月處理 Token 數"},{"value":"430","label":"部署之 AMD MI300X GPU 數量"}],"sources":[{"source_name":"Microsoft AI Blog","url":"https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"},{"source_name":"Azure Blog","url":"https://azure.microsoft.com/en-us/blog/att-and-microsoft-scale-trillion-token-workloads-with-microsoft-foundry-and-amd/"},{"source_name":"AWS ML Blog","url":"https://aws.amazon.com/blogs/machine-learning/best-practices-for-applying-amazon-bedrock-guardrails-to-code-generation-workflows/"}],"sections":[{"heading":"發生了什麼","paragraphs":["通用大模型往往缺乏電信網路、標準與營運的專業知識。為了打破這個瓶頸，電信巨頭 AT&T 推出新一代 Open Telco（OTel2.0）模型，透過 Microsoft Foundry Managed Compute 平台，靈活調度多款開源模型與硬體架構，支援萬億級 Token 的大規模數據處理。","在這次部署中，AT&T 採用了多開源模型策略，包含 Hugging Face 社群中的 Phi-4、OSS-120B 以及 Gemma 4。其中 Phi-4 在數據準備與合成數據生成階段，每月處理超過 7000 億個 Token。底層硬體則動用了約 530 張 GPU，包含 430 張 AMD Instinct MI300X GPU 以及 NVIDIA GPU，成功將模型與硬體的部署時間從數週縮短至數小時。"]},{"heading":"為什麼重要","paragraphs":["這項實踐展示了企業級 AI 發展的關鍵轉折：企業不再需要被單一模型或單一晶片供應商綁架。過去團隊必須自行維護龐大的硬體基礎設施與營運負擔，而現在透過託管計算平台，能像調酒一樣，依據不同任務混搭最適化的模型與算力。","例如處理高階推理任務時調用 OSS 120B，進行數據準備時使用 Phi-4，而開發工作流則交給 Gemma 4。配合跨晶片架構的異質算力，企業能在控管成本與維持效能之間取得最佳平衡，讓大規模領域專用 AI 的開發變得極具可行性。"]},{"heading":"值得追蹤的後續","paragraphs":["雖然異質算力與多模型組合帶來了極高的彈性，但不同 GPU 架構之間的軟體優化程度、吞吐量瓶頸以及跨架構調度的維護成本，仍是大規模營運時必須面臨的實務考驗。隨著 AT&T 將 OTel 模型回饋給社群，這套開放架構在實際電信場景中的長期總體持有成本與維護複雜度，將是未來技術評估的核心指標。"]}],"delta_insight":{"paragraphs":["可以想像，當我們在思考廠區設備報修或 IT Helpdesk 等內部 AI 應用時，不一定要強制全公司統一採用單一昂貴的大模型。我們可以試著將任務拆解，讓較輕量、成本較低的模型去處理日常假勤查詢或格式化數據整理，而將複雜的推理任務留給高階模型。","在硬體與平台規劃上，同樣可以思考如何透過靈活的架構分配算力資源。透過任務分流與適度搭配不同規格的硬體，能夠在滿足各部門回應速度需求的同時，精準控制整體營運成本。"]}},
  {"content_type":"practical","chosen_headline":"試播兩人沒事、十五人同時開工卻卡死：AI 自動寫程式的防護牆調校課","card_summary":{"text":"15 位工程師同時使用 Claude Code 卻導致系統卡死，原因出自預設防護牆每 50 字元就檢查一次。"},"stats":[{"value":"15 人","label":"同時上線引發 ThrottlingException 的開發者人數"},{"value":"5,000 字元","label":"工程師平均每個函式產生的程式碼長度"},{"value":"50 字元","label":"預設觸發防護牆評估的串流間隔"}],"sources":[{"source_name":"AWS ML Blog","url":"https://aws.amazon.com/blogs/machine-learning/best-practices-for-applying-amazon-bedrock-guardrails-to-code-generation-workflows/"}],"sections":[{"heading":"痛點","paragraphs":["一家團隊將 Amazon Bedrock 上的 Claude Code 推廣給 15 位工程師使用。雖然兩人的小規模測試非常順利，但當 15 人同時展開寫程式任務時，系統卻頻繁傳回 ThrottlingException 錯誤，程式碼生成甚至在中途直接卡死。"]},{"heading":"具體做法","paragraphs":["問題的根源在於檢查機制太過頻繁。工程師平均每編寫一個函式就會產生約 5,000 個字元，但在預設的串流設定下，系統每產出 50 個字元就會觸發一次防護牆評估，導致 API 請求量瞬間暴增。","導入程式碼輔助工具時，防護牆必須防範提示詞攻擊、遮蔽金鑰與個人資料，並攔截違規內容。要維持系統順暢，關鍵在於重新設定串流評估的字元間隔與吞吐量配置，避免過度頻繁的檢測干擾開發流程。"]},{"heading":"成效或注意事項","paragraphs":["如果沒有針對團隊併發需求進行容量規劃與參數調整，防護牆可能帶來 API 限制、成本上升與延遲增加等問題。透過精準調整串流檢查頻率，能在確保金鑰防護與安全審查的同時，維持多位開發者順暢並行的作業體驗。"]}],"delta_insight":null},
  {"content_type":"practical","chosen_headline":"從儀表板到決策：Quick 與 NeMo 如何串連供應鏈調查流程","card_summary":{"text":"Quick 搭配 NeMo 打造供應鏈 Agent 工作流，自動整合多源數據並提供帶證據的緩解建議。"},"stats":[{"value":"100+","label":"預建動作連接器數量"}],"sources":[{"source_name":"AWS ML Blog","url":"https://aws.amazon.com/blogs/machine-learning/build-specialized-agent-workflows-for-your-business-with-amazon-quick-and-nvidia-nemo-agent-toolkit/"},{"source_name":"AWS ML Blog","url":"https://aws.amazon.com/blogs/machine-learning/evolving-from-legacy-bi-to-agentic-ai-at-tradeshift-with-amazon-quick/"}],"sections":[{"heading":"痛點","paragraphs":["當你看到儀表板紅燈亮起，代表供應商可能延遲交貨。接下來最耗時的不是發現問題，而是手動去查採購單、庫存、客戶承諾、合約規則和物流選項。","計畫員往往有足夠數據知道出事了，卻沒時間逐一調查每個中斷環節。我們需要的不只是看見訊號，而是能推薦下一步行動並提供證據的工作流。"]},{"heading":"具體做法","paragraphs":["這個方案結合 Amazon Quick 與 NVIDIA NeMo Agent Toolkit。Quick 作為業務使用者的單一對話工作區，能連接 Amazon S3、SharePoint、Confluence 等結構化與非結構化知識來源。","透過 NeMo Agent Toolkit 建立供應鏈風險範例，系統能引導計畫員從儀表板情境進入緩解建議流程。Quick 內建超過 100 個預建動作連接器，可直接在 Outlook、Slack、Jira 等第三方系統執行動作，並透過 Model Context Protocol 調用 Agent 工作流。"]},{"heading":"成效或注意事項","paragraphs":["這種架構讓 AI 能自動比對多源數據並給出帶證據的建議，而非僅提供報表。重點在於將分散的資訊查詢轉化為結構化的決策輔助，減少人工切換系統的時間。"]}],"delta_insight":null},
  {"content_type":"practical","chosen_headline":"QuickSight 畫不出來的圖，Highcharts 怎麼補？","card_summary":{"text":"原生圖表無法兼顧美英市場結構差異，Highcharts 補齊雷達圖與彈道圖缺口"},"stats":[{"value":"49","label":"美國涵蓋的州數"},{"value":"7","label":"同時描繪的績效類別數"}],"sources":[{"source_name":"AWS ML Blog","url":"https://aws.amazon.com/blogs/machine-learning/building-multi-region-visualizations-with-highcharts-in-amazon-quick/"},{"source_name":"AWS ML Blog","url":"https://aws.amazon.com/blogs/machine-learning/how-couchbase-built-a-multi-model-ai-architecture-for-capella-iq-with-amazon-bedrock/"}],"sections":[{"heading":"痛點","paragraphs":["當你的運送商績效數據跨越美國與英國時，你會發現標準儀表板根本無法兼顧兩地的結構差異。美國市場涵蓋 49 個州與數百個都會區，競爭者僅三家；英國則是全國性區域劃分，競爭者有四家。","這種在地圖範圍、市場密度與競爭對手數量上的根本不同，意味著沒有一種現成的圖表類型能同時說清楚這兩個故事。你需要的不只是地理位置的展示，而是要同時回答誰領先、領先多少、是否穩定以及趨勢走向等層層問題。"]},{"heading":"具體做法","paragraphs":["試圖用 Amazon QuickSight 的原生功能來近似這些視覺效果，就像試圖用同一把直尺去量圓形和方形的面積，永遠無法貼合邊緣。你最終會被迫為每個區域建立獨立的儀表板，或者使用堆疊長條圖來勉強表示差異，甚至不得不平均化指標，從而掩蓋了某個運送商在最佳與最差市場之間的波動性。","要解決這個問題，你需要引入 Highcharts 來擴展 QuickSight 的能力。透過 Highcharts，你可以渲染原生功能無法支援的圖表類型，例如能同時描繪七家運送商在七項績效類別中表現的雷達圖，此外還能產生彈道圖與啞鈴圖，讓單一視圖就能梳理出結構根本不同的競爭態勢。"]},{"heading":"成效或注意事項","paragraphs":["整合 Highcharts 後，不再需要為了兼顧不同地區的結構差異而犧牲數據的完整性，儀表板能在單一視圖中同時處理地理與結構上的雙重挑戰，確保決策者看到完整的數據故事，而不只是被平均數掩蓋的局部真相。"]}],"delta_insight":null},
  {"content_type":"practical","chosen_headline":"小企業沒等AI邀請函：58%員工已產出一年前無法完成的工作","card_summary":{"text":"中小企業現金流僅27天，卻用AI創造新價值。58%員工產出過去不可能的工作。"},"stats":[{"value":"27天","label":"中小企業中位數現金儲備"},{"value":"58%","label":"AI使用者產出一年前無法完成的工作"},{"value":"90%","label":"全球中小企業佔比"}],"sources":[{"source_name":"Microsoft AI Blog","url":"https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"},{"source_name":"Microsoft AI Blog","url":"https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/06/29/small-and-medium-businesses-arent-waiting-for-an-ai-invitation-theyre-already-leading/"}],"sections":[{"heading":"痛點","paragraphs":["中小企業的全球經濟地位穩固，佔據90%的企業數量、50%的GDP以及70%的就業人口。","但他們沒有大企業那種「試錯」的奢侈。中位數的小企業現金儲備僅有27天，這意味著他們不能隨便押注錯誤的轉型方向，必須一次做對。"]},{"heading":"具體做法","paragraphs":["面對資源限制，這些企業不再等待完美時機，而是將AI直接嵌入日常營運流程。","他們不追求炫技，而是聚焦於解決實際瓶頸。例如動物保護組織利用數據預測「小貓季節」的收容需求，非營利組織減少行政文書時間以專注志工輔導。這種做法的核心是將AI視為解決特定業務痛點的工具，而非單純的技術升級。"]},{"heading":"成效或注意事項","paragraphs":["根據Microsoft Work Trend Index 2026數據，AI已從生產力附加價值轉變為競爭優勢。","58%的AI使用者表示，他們正在產出一年前無法完成的工作內容。66%的使用者報告了具體的效率提升或工作範圍擴展。"]}],"delta_insight":null},
  {"content_type":"practical","chosen_headline":"查詢快了30倍、成本降40%：Tradeshift 如何棄用自研BI轉向Agentic AI","card_summary":{"text":"Tradeshift 棄用自研BI，轉向 Amazon Quick Agentic AI。查詢快30倍，成本降40%，更將分析轉為營收來源。"},"stats":[{"value":"30x","label":"查詢回應時間提升倍數"},{"value":"40%","label":"總擁有成本降低比例"}],"sources":[{"source_name":"AWS ML Blog","url":"https://aws.amazon.com/blogs/machine-learning/build-specialized-agent-workflows-for-your-business-with-amazon-quick-and-nvidia-nemo-agent-toolkit/"},{"source_name":"AWS ML Blog","url":"https://aws.amazon.com/blogs/machine-learning/evolving-from-legacy-bi-to-agentic-ai-at-tradeshift-with-amazon-quick/"}],"sections":[{"heading":"痛點","paragraphs":["隨著業務擴張，Tradeshift 發現內部自行開發的商業智能（BI）工具無法負荷日益增長的數據量。","這導致查詢速度緩慢，無法滿足買家與賣家雙方對即時分析的需求，成為業務發展的瓶頸。"]},{"heading":"具體做法","paragraphs":["他們選擇部署 Amazon Quick 這個 Agentic AI 工作區，取代原有的系統。Amazon Quick 能連接所有應用程式、工具與數據，並具備企業級安全防護。","透過自然語言對話代理，員工可以直接用口語詢問業務數據。同時利用 Flows 功能自動化多步驟工作流，無需撰寫程式碼。研究功能則能整合多來源資訊，生成長篇深度分析報告。"]},{"heading":"成效或注意事項","paragraphs":["轉型後，查詢回應時間最多提升了 30 倍，總擁有成本降低了 40%。更重要的是，他們將嵌入式分析轉化為可產生營收的產品，成功變現。"]}],"delta_insight":null},
  {"content_type":"practical","chosen_headline":"別再埋首文書：AI 如何讓非營利組織把時間還給真正重要的事","card_summary":{"text":"非營利組織正用 AI 擺脫文書淹沒的困境，將時間投入核心使命。"},"stats":[{"value":"90%","label":"全球中小企業佔比"},{"value":"50%","label":"全球 GDP 貢獻"},{"value":"70%","label":"全球勞動力佔比"}],"sources":[{"source_name":"Microsoft AI Blog","url":"https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"}],"sections":[{"heading":"痛點","paragraphs":["你想像過那種感覺嗎？明明是想幫忙，卻被無限堆疊的表格和對帳單淹沒。對於許多非營利組織來說，這就是日常。隨著組織規模擴大，來自收容所、志工、支持者的數據像潮水般湧入，團隊每個月都要花上好幾個小時手動整理。"]},{"heading":"具體做法","paragraphs":["丹麥動物保護協會面臨過同樣的困境，每年「小貓季節」來臨前需要精準預測照顧缺口，現在他們利用微軟的數據與 AI 工具將雜亂資訊轉化為清晰洞察。","另一個例子是小型非營利組織 Everything Suarve，透過 AI 處理例行性工作，把志工的時間還給核心使命：陪伴與指導年輕人。"]},{"heading":"成效或注意事項","paragraphs":["結果很直接：他們能做以前做不到的事。AI 幫助這些組織擴大機會、強化社區連結，即使資源有限，也能發揮超越自身規模的影響力。"]}],"delta_insight":null}

const CONTENT_TYPE_NAMES = { insight: "洞見型", practical: "實用型" };
const ACCENT_CYCLE = ["pear", "cyan"];

function renderTopics() {
  const wrap = document.getElementById('topics');
  wrap.innerHTML = TOPICS.map((t, i) => {
    const accent = ACCENT_CYCLE[i % ACCENT_CYCLE.length];
    const statHtml = t.stats.map(s => `<div class="stat-tile"><span class="stat-value">${s.value}</span><span class="stat-label">${s.label}</span></div>`).join('');
    const sectionsHtml = t.sections.map(s => `<div class="topic-section"><span class="run-in">${s.heading}</span>${s.paragraphs.map(p => `<p>${p}</p>`).join('')}</div>`).join('');
    const insightHtml = t.delta_insight ? `<div class="delta-insight"><span class="run-in">這對我們意味著什麼</span>${t.delta_insight.paragraphs.map(p => `<p>${p}</p>`).join('')}</div>` : '';
    const sourceHtml = t.sources.map(s => `<a class="btn" href="${s.url}" target="_blank" rel="noopener noreferrer">${s.source_name} ↗</a>`).join('');
    return `
    <article class="topic topic--${accent}" data-index="${i}">
      <div class="topic-head" data-toggle>
        <div class="topic-kicker-row">
          <span class="topic-kicker">${CONTENT_TYPE_NAMES[t.content_type] || t.content_type}</span>
          <span class="topic-stamp" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg></span>
        </div>
        <h2>${t.chosen_headline}</h2>
        <p class="topic-teaser">${t.card_summary.text}</p>
        <div class="stat-row">${statHtml}</div>
        <button class="expand-toggle" type="button" data-toggle-btn>
          <span data-i18n-inline="expand">閱讀全文</span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="topic-panel">
        <div class="topic-panel-inner">
          <div class="topic-body">${sectionsHtml}${insightHtml}</div>
          <div class="source-row">
            ${sourceHtml}
            <button class="btn btn--stamp" type="button" data-stamp-btn>
              <span data-i18n-inline="stamp">讀完了，蓋章</span>
            </button>
          </div>
        </div>
      </div>
    </article>`;
  }).join('');

  wrap.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-stamp-btn]')) return;
      el.closest('.topic').classList.toggle('is-open');
    });
  });
  wrap.querySelectorAll('[data-stamp-btn]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const topic = btn.closest('.topic');
      if (topic.classList.contains('is-collected')) return;
      collect(Number(topic.dataset.index));
      burst(btn);
    });
  });
}

function burst(btn) {
  const rect = btn.getBoundingClientRect();
  const star = document.createElement('span');
  star.className = 'star-burst';
  star.style.position = 'fixed';
  star.style.left = (rect.left + rect.width / 2 - 11) + 'px';
  star.style.top = (rect.top + rect.height / 2 - 11) + 'px';
  document.body.appendChild(star);
  setTimeout(() => star.remove(), 450);
}

const STORAGE_KEY = 'deltaMockStamps:hum-v2';
let collected = new Set();
try { collected = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch (e) {}

function collect(i) {
  if (collected.has(i)) return;
  collected.add(i);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(collected)));
  applyCollectedState();
  updateProgress();
}
function applyCollectedState() {
  document.querySelectorAll('.topic').forEach(el => {
    el.classList.toggle('is-collected', collected.has(Number(el.dataset.index)));
  });
}
function updateProgress() {
  const lang = document.documentElement.getAttribute('data-lang');
  document.getElementById('streak-count').textContent = I18N[lang].progress(collected.size);
  document.getElementById('streak-fill').style.width = (collected.size / TOPICS.length * 100) + '%';
}

function applyLang(lang) {
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('lang-btn-label').textContent = LANG_LABEL[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = I18N[lang][el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-inline]').forEach(el => {
    const key = el.dataset.i18nInline;
    if (key !== 'stamp' || !el.closest('.topic').classList.contains('is-collected')) {
      el.textContent = I18N[lang][key];
    }
  });
  document.querySelectorAll('.lang-option').forEach(opt => opt.setAttribute('aria-checked', opt.dataset.lang === lang));
  updateProgress();
}

renderTopics();
applyCollectedState();
applyLang('zh-Hant');

const langBtn = document.getElementById('lang-btn');
const langMenu = document.getElementById('lang-menu');
langBtn.addEventListener('click', () => {
  const open = langMenu.classList.toggle('is-open');
  langBtn.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.lang-switcher')) { langMenu.classList.remove('is-open'); langBtn.setAttribute('aria-expanded', 'false'); }
});
langMenu.querySelectorAll('.lang-option').forEach(opt => {
  opt.addEventListener('click', () => { applyLang(opt.dataset.lang); langMenu.classList.remove('is-open'); });
});
</script>
</body>
</html>
