/* Hallmark · macrostructure: Marquee Hero + Catalogue (accordion variant) · genre: editorial (loud) · theme: Carnival
 * custom drop "Delta Blue". v2.1 — chosen as the lead direction. Changes from v2:
 * (1) dropped the content-type tag chip (實用型/洞見型) per feedback — reads as internal taxonomy
 *     leaking onto the page, not something a reader needs.
 * (2) headlines + full body copy rewritten in a livelier, more vivid voice (per user's 4Gamers
 *     reference — punchier hooks, more contrast, conversational verbs) while keeping every fact,
 *     stat, and source exactly as reported. Tone change only, no invented content.
 * (3) language switcher now actually swaps article content, not just chrome: zh-Hant is the
 *     native voice; zh-Hans is a real translation (OpenCC tw2sp conversion + manual correction

-->

牆。"}, "stats": [{"value": "15 人", "label": "一開工就把系統玩當機的人數"}, {"value": "5,000 字元", "label": "工程師平均每個函式產生的程式碼長度"}, {"value": "50 字元", "label": "預設觸發防護牆評估的串流間隔"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/best-practices-for-applying-amazon-bedrock-guardrails-to-code-generation-workflows/"}], "sections": [{"heading": "災情現場", "paragraphs": ["一個團隊把 Amazon Bedrock 上的 Claude Code 推給 15 位工程師用，兩人小規模測試時一切順順利利，這種劇本大家都熟，demo 永遠很順，直到真的上線那一刻。", "15 人同時開工，系統馬上翻臉，瘋狂丟出 ThrottlingException 錯誤，程式碼寫到一半直接當機卡死。"]}, {"heading": "問題出在哪、怎麼修", "paragraphs": ["兇手抓到了，是檢查機制太勤勞，工程師平均寫一個函式會產生約 5,000 個字元，但預設串流設定下，系統每吐出 50 個字元就要跳出來檢查一次防護牆，等於你打字打到一半，隔幾秒就被攔下來問一次身分證字號，換誰都會被拖慢。", "當然防護牆不能拆，它負責擋下這些事：", "<ul><li>提示詞攻擊</li><li>金鑰外洩</li><li>個資外流</li><li>違規內容</li></ul>", "真正該做的是重新校準串流評估的字元間隔跟吞吐量配置，別讓檢測頻率高到干擾整個開發節奏。"]}, {"heading": "調完之後", "paragraphs": ["如果沒事先幫團隊的併發需求做容量規劃，防護牆隨時可能反過來變成瓶頸：", "<ul><li>限流</li><li>成本飆升</li><li>延遲拉長</li></ul>", "把頻率調準之後，金鑰防護跟安全審查照樣在線，多位開發者終於能同時上工，不用再排隊等系統喘口氣。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "儀表板紅燈一亮，然後呢？Quick 聯手 NeMo 把供應鏈調查串成一條龍", "card_summary": {"text": "供應商可能要 delay 了？Quick 搭上 NVIDIA NeMo，自動把散落各處的數據兜在一起，還直接端出帶證據的解法，不用你自己土法煉鋼查半天。"}, "stats": [{"value": "100+", "label": "現成能直接用的動作連接器數量"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/build-specialized-agent-workflows-for-your-business-with-amazon-quick-and-nvidia-nemo-agent-toolkit/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/evolving-from-legacy-bi-to-agentic-ai-at-tradeshift-with-amazon-quick/"}], "sections": [{"heading": "真正頭痛的不是發現問題", "paragraphs": ["儀表板紅燈一亮，代表供應商可能要 delay 了，但發現問題從來不是最耗時的那一步，接下來得一項一項慢慢查：", "<ul><li>採購單</li><li>庫存</li><li>客戶承諾</li><li>合約條款</li><li>物流選項</li></ul>", "計畫員手上數據通常夠多，早就知道出事了，卻沒時間逐一調查每個環節，他們缺的不是更多訊號，是一套能直接推薦下一步、還附證據的工作流。"]}, {"heading": "怎麼做到的", "paragraphs": ["這套方案把 Amazon Quick 跟 NVIDIA NeMo Agent Toolkit 兜在一起，Quick 是業務端的單一對話工作區，能接上 Amazon S3、SharePoint、Confluence 這類結構化跟非結構化知識庫。", "透過 NeMo Agent Toolkit 建好供應鏈風險範例後，系統能直接引導計畫員從儀表板一路走到緩解建議，內建超過 100 個現成的動作連接器，直接在 Outlook、Slack、Jira 上動手執行，還能透過 Model Context Protocol 呼叫 Agent 工作流，等於把「資料在哪」這種苦力活整批外包出去。"]}, {"heading": "這套架構厲害在哪", "paragraphs": ["重點不是多一份報表，是 AI 能自己比對多來源數據、給出附證據的建議，原本得在好幾個系統之間跳來跳去查資料的時間，直接被壓縮成一套結構化的決策助攻。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "QuickSight 畫不出來的圖，Highcharts 出手補位", "card_summary": {"text": "美國跟英國市場結構根本是兩個世界，QuickSight 原生圖表怎麼畫都畫不對，最後靠 Highcharts 補上雷達圖跟彈道圖才解套。"}, "stats": [{"value": "49", "label": "美國涵蓋的州數"}, {"value": "7", "label": "同時描繪的績效類別數"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/building-multi-region-visualizations-with-highcharts-in-amazon-quick/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/how-couchbase-built-a-multi-model-ai-architecture-for-capella-iq-with-amazon-bedrock/"}], "sections": [{"heading": "同一把尺，量不出兩種市場", "paragraphs": ["運送商的績效數據橫跨美國跟英國，你會發現標準儀表板根本兼顧不了兩邊的結構差異，美國市場橫跨 49 州、數百個都會區，競爭者只有三家，英國是全國性劃分，競爭者卻有四家。", "地圖範圍不一樣，市場密度不一樣，競爭者數量也不一樣，沒有一種現成圖表能同時把這兩個故事講清楚。", "你要的不只是秀出地理位置，而是要一次回答誰領先、領先多少、穩不穩、走勢往哪去，這哪是畫圖問題，根本是兩個完全不同的世界硬要塞進同一張紙。"]}, {"heading": "土法煉鋼行不通，換 Highcharts", "paragraphs": ["硬要用 Amazon QuickSight 的原生功能去湊這些視覺效果，就像拿同一把尺去量圓形跟方形的面積，邊角永遠對不齊，最後不是被迫幫每個區域各開一個獨立儀表板，就是用堆疊長條圖硬撐，甚至乾脆把指標平均化，結果反而把某個運送商在最好跟最差市場之間的落差整個蓋掉。", "解法是把 Highcharts 拉進來擴充 QuickSight，能畫出原生功能畫不出來的圖，像是同時呈現七家運送商、七項績效指標的雷達圖，還有彈道圖、啞鈴圖，一張圖就能講完兩種完全不同的競爭結構。"]}, {"heading": "換掉之後", "paragraphs": ["接上 Highcharts 之後，不用再為了兼顧不同地區的結構差異，犧牲數據完整性或搞一堆繞路的 workaround，儀表板能在同一個畫面裡同時處理地理跟結構的雙重挑戰。", "決策者看到的是完整的數據故事，不是被平均數字蓋過去的局部真相，這才是一張圖表原本該做到的事。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "小企業沒空等 AI 邀請函：58% 員工已經在做一年前做不到的事", "card_summary": {"text": "手上現金只夠撐 27 天，卻是最先把 AI 用出成績的一群人。58% 的員工已經在做一年前根本做不到的事。"}, "stats": [{"value": "27天", "label": "中小企業現金儲備天數中位數"}, {"value": "58%", "label": "AI 使用者已產出一年前做不到的工作"}, {"value": "90%", "label": "全球企業中中小企業佔比"}], "sources": [{"source_name": "Microsoft AI Blog", "url": "https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"}, {"source_name": "Microsoft AI Blog", "url": "https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/06/29/small-and-medium-businesses-arent-waiting-for-an-ai-invitation-theyre-already-leading/"}], "sections": [{"heading": "沒有試錯的本錢", "paragraphs": ["中小企業的經濟地位穩得很，佔了全球 90% 的企業數量、50% 的 GDP、70% 的就業人口。", "但他們沒有大企業那種「先試錯再說」的奢侈，現金儲備中位數只有 27 天，一步走錯方向很可能就沒有下一步了，大企業燒得起一輪失敗的實驗，小企業連半輪都燒不起。"]}, {"heading": "不等邀請函，直接上手", "paragraphs": ["資源有限，這些企業沒空等一個完美時機，直接把 AI 嵌進日常營運流程裡，他們不炫技，只解決真正卡住的問題，像動物保護組織用數據預測「小貓季節」的收容需求，非營利組織把行政文書時間砍掉、把心力還給志工輔導。", "核心邏輯很簡單，AI 是解決具體痛點的工具，不是拿來展示技術有多先進的秀。"]}, {"heading": "數字說話", "paragraphs": ["根據 Microsoft Work Trend Index 2026，AI 已經從「加分項」變成「競爭優勢」，58% 的 AI 使用者說，他們正在做一年前根本做不到的工作內容，66% 回報了具體的效率提升或工作範圍擴大。", "算一算，等於每兩個用 AI 的人裡面，就有一個多出了以前想都不敢想的產出，資源有限反而逼出了效率，這大概是最反直覺卻也最實在的結果。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "查詢快了 30 倍、成本降 40%：Tradeshift 砍掉自研 BI 全面轉向 Agentic AI", "card_summary": {"text": "自己養的 BI 養到養不動，Tradeshift 乾脆全部砍掉重練，換上 Amazon Quick 的 Agentic AI。查詢速度衝上 30 倍，成本砍 40%，分析這件事還順便變成賺錢的產品。"}, "stats": [{"value": "30x", "label": "查詢回應時間提升倍數"}, {"value": "40%", "label": "總擁有成本降低比例"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/build-specialized-agent-workflows-for-your-business-with-amazon-quick-and-nvidia-nemo-agent-toolkit/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/evolving-from-legacy-bi-to-agentic-ai-at-tradeshift-with-amazon-quick/"}], "sections": [{"heading": "自己養的 BI，養不動了", "paragraphs": ["業務越做越大，Tradeshift 才發現自己內部養的商業智能（BI）工具已經扛不住暴增的資料量，查詢速度慢到讓買賣雙方都等不下去，直接變成業務發展的天花板。", "自己養的系統，養到後來反過來咬自己一口，這種劇情並不少見。"]}, {"heading": "砍掉重練，換 Agentic AI", "paragraphs": ["他們選擇直接部署 Amazon Quick 這個 Agentic AI 工作區，取代舊系統，Amazon Quick 能接上所有應用程式、工具跟數據，企業級安全防護也一併到位。", "靠對話代理，員工用講的就能問業務數據，Flows 功能能把多步驟工作流直接自動化，不用寫一行程式碼，研究功能還能整合多來源資訊，生出一份長篇深度分析報告。"]}, {"heading": "換完之後有多爽", "paragraphs": ["查詢回應時間最多衝上 30 倍，總擁有成本砍掉 40%，打個比方，原本泡杯咖啡等結果都還沒跑完的查詢，現在咖啡都還沒喝一口就出來了。", "更狠的是，他們直接把嵌入式分析變成一款能賺錢的產品，成功把成本中心翻轉成營收來源。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "別再被表格淹死：AI 把時間還給非營利組織真正該做的事", "card_summary": {"text": "表格對帳單堆到淹過頭，非營利組織終於靠 AI 從文書海裡爬出來，把時間還給真正重要的使命。"}, "stats": [{"value": "90%", "label": "全球企業中中小企業佔比"}, {"value": "50%", "label": "中小企業對全球 GDP 的貢獻"}, {"value": "70%", "label": "中小企業佔全球勞動力比例"}], "sources": [{"source_name": "Microsoft AI Blog", "url": "https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"}], "sections": [{"heading": "被表格淹沒的日常", "paragraphs": ["你想像過那種感覺嗎？明明只是想幫忙，卻被無止盡的表格跟對帳單活埋，對很多非營利組織來說，這就是日常。", "組織一旦擴大，收容所、志工、支持者的數據像潮水一樣湧進來，團隊每個月得花上好幾個小時，手動把不同系統的資料兜在一起，不只累人，連預測需求、調度資源都變得綁手綁腳。"]}, {"heading": "AI 接手之後", "paragraphs": ["丹麥動物保護協會（Animal Protection Denmark）也踩過同樣的坑，每年「小貓季節」來臨前，他們得精準預測哪裡會出現照顧缺口，過去全靠經驗猜，現在靠微軟的數據跟 AI 工具，把一團亂的資訊變成看得懂的洞察。", "另一個例子是小型非營利組織 Everything Suarve，不再讓志工把寶貴時間耗在瑣碎行政流程上，AI 接手例行工作，團隊終於能把心力放回核心使命，陪伴跟指導年輕人。", "還有研究神經退化疾病的團隊，也靠 AI 加速治療方案的開發進度。這些做法有一個共同點，技術不是重點，把人力從重複勞動裡解放出來才是。"]}, {"heading": "結果很直接", "paragraphs": ["他們現在能做以前做不到的事，AI 幫這些組織擴大機會、強化社區連結，替受助者創造新的可能性。", "就算資源有限，照樣能發揮超出自身規模的影響力，這證明 AI 不是大企業的專利，它正在幫全球非營利組織對抗最迫切的挑戰，資源少不代表能做的事也少，這幾個例子算是最好的反證。"]}], "delta_insight": null}], "zh-Hans": [{"content_type": "insight", "chosen_headline": "月烧 7000 亿 Token 什么概念？AT&T 砸 530 张 GPU 硬干电信专属 AI", "card_summary": {"text": "别家电信公司还在观望，AT&T 直接跟 Microsoft Foundry 联手，动用 530 张混合 GPU，养出一个月能吃下数千亿 Token 的电信专属怪兽模型。"}, "stats": [{"value": "700B+", "label": "Phi-4 一个月吃掉的 Token 量"}, {"value": "430", "label": "压阵的 AMD MI300X GPU 数量"}], "sources": [{"source_name": "Microsoft AI Blog", "url": "https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"}, {"source_name": "Azure Blog", "url": "https://azure.microsoft.com/en-us/blog/att-and-microsoft-scale-trillion-token-workloads-with-microsoft-foundry-and-amd/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/best-practices-for-applying-amazon-bedrock-guardrails-to-code-generation-workflows/"}], "sections": [{"heading": "到底在烧什么", "paragraphs": ["假设你要养一个每个月得吃下 7000 亿个 Token 的东西，多数公司大概会直接投降，毕竟通用大模型对电信业其实一无所知，标准、网络架构、营运眉角，它一窍不通，AT&T 干脆自己养一只。", "于是联手 Microsoft Foundry，端出一套叫 Open Telco（OTel2.0）的模型，挂在 Foundry 的 Managed Compute 平台上跑，阵容也找得夸张，Hugging Face 上的 Phi-4、OSS-120B、Gemma 4 全部找齐，各司其职，高端推理丢给 OSS 120B，数据准备交给 Phi-4，开发流程让 Gemma 4 顶着，硬件更是砸得毫不手软，约 530 张 GPU 一次顶上，其中 430 张是 AMD Instinct MI300X，剩下配 NVIDIA 的，把原本要花好几周的部署时间，压缩到只剩几小时。", "换算一下，原本要等三个礼拜才会到货的网购包裹，现在早上下单，晚餐前就能拆箱，电信业大概有十年没体验过这种速度了。"]}, {"heading": "为什么这事值得你多看一眼", "paragraphs": ["这件事真正厉害的地方不是 GPU 数量，是它拆掉了一个旧迷思，企业以为只能绑死在单一模型或单一芯片厂商上，现在丢给托管计算平台，爱怎么混搭就怎么混搭，高端任务配高端模型，杂活丢给便宜模型。"]}, {"heading": "接下来要盯紧什么", "paragraphs": ["当然喂养这只怪兽不是没有代价，不同 GPU 架构的软件优化程度不一，吞吐量卡关，跨架构调度的维运成本也不便宜，长期总持有成本会是接下来大家该盯紧的地方。", "AT&T 已经把 OTel 模型回馈给社群，难的部分算是先示范了一次。"]}], "delta_insight": {"paragraphs": ["下次公司又在喊「算力不够」，或许可以想想，问题可能不是不够，是还没想清楚要怎么分配，厂区设备报修、IT Helpdesk 这类内部应用，不用全部押在一颗昂贵大模型上，日常查询丢给便宜模型，烧脑推理才留给高端的，硬件规划也是同一套逻辑。"]}}, {"content_type": "practical", "chosen_headline": "两人测试好好的，十五人一起开工系统直接暴毙：AI 写程序的防护墙到底卡在哪", "card_summary": {"text": "15 个工程师一起用 Claude Code，系统当场僵住不动。凶手竟然是那个每 50 个字符就要跳出来检查一次的缺省防护墙。"}, "stats": [{"value": "15 人", "label": "一开工就把系统玩当机的人数"}, {"value": "5,000 字符", "label": "工程师平均每个函数产生的代码长度"}, {"value": "50 字符", "label": "缺省触发防护墙评估的串流间隔"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/best-practices-for-applying-amazon-bedrock-guardrails-to-code-generation-workflows/"}], "sections": [{"heading": "灾情现场", "paragraphs": ["一个团队把 Amazon Bedrock 上的 Claude Code 推给 15 位工程师用，两人小规模测试时一切顺顺利利，这种剧本大家都熟，demo 永远很顺，直到真的上线那一刻。", "15 人同时开工，系统马上翻脸，疯狂丢出 ThrottlingException 错误，代码写到一半直接当机卡死。"]}, {"heading": "问题出在哪、怎么修", "paragraphs": ["凶手抓到了，是检查机制太勤劳，工程师平均写一个函数会产生约 5,000 个字符，但缺省串流设置下，系统每吐出 50 个字符就要跳出来检查一次防护墙，等于你打字打到一半，隔几秒就被拦下来问一次身分证字号，换谁都会被拖慢。", "当然防护墙不能拆，它负责挡下这些事：", "<ul><li>提示词攻击</li><li>密钥外泄</li><li>个资外流</li><li>违规内容</li></ul>", "真正该做的是重新校准串流评估的字符间隔跟吞吐量配置，别让检测频率高到干扰整个开发节奏。"]}, {"heading": "调完之后", "paragraphs": ["如果没事先帮团队的并发需求做容量规划，防护墙随时可能反过来变成瓶颈：", "<ul><li>限流</li><li>成本飙升</li><li>延迟拉长</li></ul>", "把频率调准之后，密钥防护跟安全审查照样在线，多位开发者终于能同时上工，不用再排队等系统喘口气。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "仪表板红灯一亮，然后呢？Quick 联手 NeMo 把供应链调查串成一条龙", "card_summary": {"text": "供应商可能要 delay 了？Quick 搭上 NVIDIA NeMo，自动把散落各处的数据兜在一起，还直接端出带证据的解法，不用你自己土法炼钢查半天。"}, "stats": [{"value": "100+", "label": "现成能直接用的动作连接器数量"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/build-specialized-agent-workflows-for-your-business-with-amazon-quick-and-nvidia-nemo-agent-toolkit/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/evolving-from-legacy-bi-to-agentic-ai-at-tradeshift-with-amazon-quick/"}], "sections": [{"heading": "真正头痛的不是发现问题", "paragraphs": ["仪表板红灯一亮，代表供应商可能要 delay 了，但发现问题从来不是最耗时的那一步，接下来得一项一项慢慢查：", "<ul><li>采购单</li><li>库存</li><li>客户承诺</li><li>合约条款</li><li>物流选项</li></ul>", "计划员手上数据通常够多，早就知道出事了，却没时间逐一调查每个环节，他们缺的不是更多信号，是一套能直接推荐下一步、还附证据的工作流。"]}, {"heading": "怎么做到的", "paragraphs": ["这套方案把 Amazon Quick 跟 NVIDIA NeMo Agent Toolkit 兜在一起，Quick 是业务端的单一对话工作区，能接上 Amazon S3、SharePoint、Confluence 这类结构化跟非结构化知识库。", "通过 NeMo Agent Toolkit 建好供应链风险范例后，系统能直接引导计划员从仪表板一路走到缓解建议，内置超过 100 个现成的动作连接器，直接在 Outlook、Slack、Jira 上动手运行，还能通过 Model Context Protocol 调用 Agent 工作流，等于把「数据在哪」这种苦力活整批外包出去。"]}, {"heading": "这套架构厉害在哪", "paragraphs": ["重点不是多一份报表，是 AI 能自己比对多来源数据、给出附证据的建议，原本得在好几个系统之间跳来跳去查数据的时间，直接被压缩成一套结构化的决策助攻。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "QuickSight 画不出来的图，Highcharts 出手补位", "card_summary": {"text": "美国跟英国市场结构根本是两个世界，QuickSight 原生图表怎么画都画不对，最后靠 Highcharts 补上雷达图跟弹道图才解套。"}, "stats": [{"value": "49", "label": "美国涵盖的州数"}, {"value": "7", "label": "同时描绘的绩效类别数"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/building-multi-region-visualizations-with-highcharts-in-amazon-quick/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/how-couchbase-built-a-multi-model-ai-architecture-for-capella-iq-with-amazon-bedrock/"}], "sections": [{"heading": "同一把尺，量不出两种市场", "paragraphs": ["运送商的绩效数据横跨美国跟英国，你会发现标准仪表板根本兼顾不了两边的结构差异，美国市场横跨 49 州、数百个都会区，竞争者只有三家，英国是全国性划分，竞争者却有四家。", "地图范围不一样，市场密度不一样，竞争者数量也不一样，没有一种现成图表能同时把这两个故事讲清楚。", "你要的不只是秀出地理位置，而是要一次回答谁领先、领先多少、稳不稳、走势往哪去，这哪是画图问题，根本是两个完全不同的世界硬要塞进同一张纸。"]}, {"heading": "土法炼钢行不通，换 Highcharts", "paragraphs": ["硬要用 Amazon QuickSight 的原生功能去凑这些视觉效果，就像拿同一把尺去量圆形跟方形的面积，边角永远对不齐，最后不是被迫帮每个区域各开一个独立仪表板，就是用堆栈长条图硬撑，甚至干脆把指标平均化，结果反而把某个运送商在最好跟最差市场之间的落差整个盖掉。", "解法是把 Highcharts 拉进来扩充 QuickSight，能画出原生功能画不出来的图，像是同时呈现七家运送商、七项绩效指标的雷达图，还有弹道图、哑铃图，一张图就能讲完两种完全不同的竞争结构。"]}, {"heading": "换掉之后", "paragraphs": ["接上 Highcharts 之后，不用再为了兼顾不同地区的结构差异，牺牲数据完整性或搞一堆绕路的 workaround，仪表板能在同一个画面里同时处理地理跟结构的双重挑战。", "决策者看到的是完整的数据故事，不是被平均数字盖过去的局部真相，这才是一张图表原本该做到的事。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "小企业没空等 AI 邀请函：58% 员工已经在做一年前做不到的事", "card_summary": {"text": "手上现金只够撑 27 天，却是最先把 AI 用出成绩的一群人。58% 的员工已经在做一年前根本做不到的事。"}, "stats": [{"value": "27天", "label": "中小企业现金储备天数中位数"}, {"value": "58%", "label": "AI 用户已产出一年前做不到的工作"}, {"value": "90%", "label": "全球企业中中小企业占比"}], "sources": [{"source_name": "Microsoft AI Blog", "url": "https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"}, {"source_name": "Microsoft AI Blog", "url": "https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/06/29/small-and-medium-businesses-arent-waiting-for-an-ai-invitation-theyre-already-leading/"}], "sections": [{"heading": "没有试错的本钱", "paragraphs": ["中小企业的经济地位稳得很，占了全球 90% 的企业数量、50% 的 GDP、70% 的就业人口。", "但他们没有大企业那种「先试错再说」的奢侈，现金储备中位数只有 27 天，一步走错方向很可能就没有下一步了，大企业烧得起一轮失败的实验，小企业连半轮都烧不起。"]}, {"heading": "不等邀请函，直接上手", "paragraphs": ["资源有限，这些企业没空等一个完美时机，直接把 AI 嵌进日常营运流程里，他们不炫技，只解决真正卡住的问题，像动物保护组织用数据预测「小猫季节」的收容需求，非营利组织把行政文书时间砍掉、把心力还给志工辅导。", "核心逻辑很简单，AI 是解决具体痛点的工具，不是拿来展示技术有多先进的秀。"]}, {"heading": "数字说话", "paragraphs": ["根据 Microsoft Work Trend Index 2026，AI 已经从「加分项」变成「竞争优势」，58% 的 AI 用户说，他们正在做一年前根本做不到的工作内容，66% 回报了具体的效率提升或工作范围扩大。", "算一算，等于每两个用 AI 的人里面，就有一个多出了以前想都不敢想的产出，资源有限反而逼出了效率，这大概是最反直觉却也最实在的结果。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "查询快了 30 倍、成本降 40%：Tradeshift 砍掉自研 BI 全面转向 Agentic AI", "card_summary": {"text": "自己养的 BI 养到养不动，Tradeshift 干脆全部砍掉重练，换上 Amazon Quick 的 Agentic AI。查询速度冲上 30 倍，成本砍 40%，分析这件事还顺便变成赚钱的产品。"}, "stats": [{"value": "30x", "label": "查询回应时间提升倍数"}, {"value": "40%", "label": "总拥有成本降低比例"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/build-specialized-agent-workflows-for-your-business-with-amazon-quick-and-nvidia-nemo-agent-toolkit/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/evolving-from-legacy-bi-to-agentic-ai-at-tradeshift-with-amazon-quick/"}], "sections": [{"heading": "自己养的 BI，养不动了", "paragraphs": ["业务越做越大，Tradeshift 才发现自己内部养的商业智能（BI）工具已经扛不住暴增的数据量，查询速度慢到让买卖双方都等不下去，直接变成业务发展的天花板。", "自己养的系统，养到后来反过来咬自己一口，这种剧情并不少见。"]}, {"heading": "砍掉重练，换 Agentic AI", "paragraphs": ["他们选择直接部署 Amazon Quick 这个 Agentic AI 工作区，取代旧系统，Amazon Quick 能接上所有应用程序、工具跟数据，企业级安全防护也一并到位。", "靠对话代理，员工用讲的就能问业务数据，Flows 功能能把多步骤工作流直接自动化，不用写一行代码，研究功能还能集成多来源信息，生出一份长篇深度分析报告。"]}, {"heading": "换完之后有多爽", "paragraphs": ["查询回应时间最多冲上 30 倍，总拥有成本砍掉 40%，打个比方，原本泡杯咖啡等结果都还没跑完的查询，现在咖啡都还没喝一口就出来了。", "更狠的是，他们直接把嵌入式分析变成一款能赚钱的产品，成功把成本中心翻转成营收来源。"]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "别再被表格淹死：AI 把时间还给非营利组织真正该做的事", "card_summary": {"text": "表格对帐单堆到淹过头，非营利组织终于靠 AI 从文书海里爬出来，把时间还给真正重要的使命。"}, "stats": [{"value": "90%", "label": "全球企业中中小企业占比"}, {"value": "50%", "label": "中小企业对全球 GDP 的贡献"}, {"value": "70%", "label": "中小企业占全球劳动力比例"}], "sources": [{"source_name": "Microsoft AI Blog", "url": "https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"}], "sections": [{"heading": "被表格淹没的日常", "paragraphs": ["你想像过那种感觉吗？明明只是想帮忙，却被无止尽的表格跟对帐单活埋，对很多非营利组织来说，这就是日常。", "组织一旦扩大，收容所、志工、支持者的数据像潮水一样涌进来，团队每个月得花上好几个小时，手动把不同系统的数据兜在一起，不只累人，连预测需求、调度资源都变得绑手绑脚。"]}, {"heading": "AI 接手之后", "paragraphs": ["丹麦动物保护协会（Animal Protection Denmark）也踩过同样的坑，每年「小猫季节」来临前，他们得精准预测哪里会出现照顾缺口，过去全靠经验猜，现在靠微软的数据跟 AI 工具，把一团乱的信息变成看得懂的洞察。", "另一个例子是小型非营利组织 Everything Suarve，不再让志工把宝贵时间耗在琐碎行政流程上，AI 接手例行工作，团队终于能把心力放回核心使命，陪伴跟指导年轻人。", "还有研究神经退化疾病的团队，也靠 AI 加速治疗方案的开发进度。这些做法有一个共同点，技术不是重点，把人力从重复劳动里解放出来才是。"]}, {"heading": "结果很直接", "paragraphs": ["他们现在能做以前做不到的事，AI 帮这些组织扩大机会、强化社区链接，替受助者创造新的可能性。", "就算资源有限，照样能发挥超出自身规模的影响力，这证明 AI 不是大企业的专利，它正在帮全球非营利组织对抗最迫切的挑战，资源少不代表能做的事也少，这几个例子算是最好的反证。"]}], "delta_insight": null}], "en": [{"content_type": "insight", "chosen_headline": "700 Billion Tokens a Month? AT&T Just Brute-Forced Its Own Telecom AI With 530 GPUs", "card_summary": {"text": "Other telcos are still deciding whether to bother. AT&T teamed up with Microsoft Foundry and threw 530 mixed GPUs at the problem, raising a telecom-only model that eats hundreds of billions of tokens a month."}, "stats": [{"value": "700B+", "label": "Tokens Phi-4 chews through monthly"}, {"value": "430", "label": "AMD MI300X GPUs doing the heavy lifting"}], "sources": [{"source_name": "Microsoft AI Blog", "url": "https://www.microsoft.com/en-us/microsoft-cloud/blog/2026/07/23/ai-appreciation-day-impact-through-action/"}, {"source_name": "Azure Blog", "url": "https://azure.microsoft.com/en-us/blog/att-and-microsoft-scale-trillion-token-workloads-with-microsoft-foundry-and-amd/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/best-practices-for-applying-amazon-bedrock-guardrails-to-code-generation-workflows/"}], "sections": [{"heading": "What's actually burning here", "paragraphs": ["Say you had to feed something 700 billion tokens a month, most companies would just tap out, and general-purpose models know embarrassingly little about telecom anyway, the standards, the network architecture, the operational quirks, none of it, so AT&T decided to raise its own.", "They teamed up with Microsoft Foundry and shipped a new-generation Open Telco (OTel2.0) model on the Managed Compute platform, with a stacked lineup too, Phi-4, OSS-120B, and Gemma 4 from Hugging Face, each with a job, high-stakes reasoning to OSS 120B, data prep to Phi-4, dev workflows to Gemma 4, and the hardware doesn't hold back either, roughly 530 GPUs, 430 of them AMD Instinct MI300X, the rest NVIDIA, enough to shrink a deployment that used to take weeks down to hours.", "Put it in perspective, that's a package that used to take three weeks to arrive now getting ordered in the morning and unboxed before dinner, telecom hasn't moved at that speed in a decade."]}, {"heading": "Why this is worth your attention", "paragraphs": ["The real story here isn't the GPU count, it's that it dismantles an old assumption, that enterprises have to be hostage to one model or one chip vendor, hand it to a managed compute platform and mix however you like, expensive reasoning where it earns its keep, cheap compute for the grunt work."]}, {"heading": "What to keep watching", "paragraphs": ["Feeding a model this size isn't free, of course, uneven software optimization across GPU architectures, throughput bottlenecks, the maintenance cost of orchestrating across chip types, the long-term total cost of ownership is the number everyone should be watching next.", "AT&T already open-sourced OTel back to the community, so at least the hard part's been demonstrated once."]}], "delta_insight": {"paragraphs": ["Next time someone says \"we don't have enough compute,\" it might be worth asking whether the real problem is not having figured out how to divide the work yet, facility repair tickets, the IT Helpdesk, that kind of internal AI doesn't need to run on one expensive model for everything, routine lookups go cheap, hard reasoning goes premium, and hardware planning follows the same logic."]}}, {"content_type": "practical", "chosen_headline": "Fine With 2 Engineers, Dead on Arrival With 15: Why Your AI Coding Guardrail Just Choked", "card_summary": {"text": "15 engineers hit Claude Code at once and the whole system froze solid. The culprit: a default guardrail that stops to check every 50 characters."}, "stats": [{"value": "15", "label": "Engineers who took the system down at once"}, {"value": "5,000 chars", "label": "Avg. code length per function, per engineer"}, {"value": "50 chars", "label": "Default streaming interval that triggers a guardrail check"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/best-practices-for-applying-amazon-bedrock-guardrails-to-code-generation-workflows/"}], "sections": [{"heading": "The crime scene", "paragraphs": ["A team rolled Claude Code on Amazon Bedrock out to 15 engineers, the small test with 2 people went smoothly, and everyone knows this script by now, demos always go smoothly right up until the real launch.", "The moment all 15 started coding at once, the system turned on them, a flood of ThrottlingException errors, code generation dying mid-stream."]}, {"heading": "The actual bug, and the fix", "paragraphs": ["Culprit found, the check ran too often, engineers produce roughly 5,000 characters per function on average, but the default streaming setup fires a guardrail check every 50 characters, that's like getting carded every few seconds while you type, anyone would slow down under that.", "The guardrail can't just be ripped out, though. It's what blocks:", "<ul><li>Prompt injection</li><li>Credential leaks</li><li>PII exposure</li><li>Policy violations</li></ul>", "The real fix is recalibrating the streaming evaluation interval and throughput settings so the check frequency stops strangling the dev workflow."]}, {"heading": "After the fix", "paragraphs": ["Skip capacity planning for concurrent usage and the guardrail can flip from protection to bottleneck:", "<ul><li>Rate limits</li><li>Rising costs</li><li>Longer latency</li></ul>", "Tune the frequency right and the credential protection stays intact, but multiple developers can finally work at the same time instead of taking turns waiting for the system to catch its breath."]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "Dashboard Flashes Red. Now What? Quick + NeMo Turn Supply-Chain Sleuthing Into One Flow", "card_summary": {"text": "Supplier running late? Quick paired with NVIDIA NeMo pulls the scattered data together automatically and hands you an evidence-backed answer, instead of leaving you to dig through six systems yourself."}, "stats": [{"value": "100+", "label": "Ready-made action connectors"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/build-specialized-agent-workflows-for-your-business-with-amazon-quick-and-nvidia-nemo-agent-toolkit/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/evolving-from-legacy-bi-to-agentic-ai-at-tradeshift-with-amazon-quick/"}], "sections": [{"heading": "The pain was never spotting the problem", "paragraphs": ["A red light on the dashboard usually means a supplier might be late, but spotting that was never the slow part, it's what comes next:", "<ul><li>Purchase orders</li><li>Inventory</li><li>Customer commitments</li><li>Contract terms</li><li>Shipping options</li></ul>", "Planners usually have enough data to know something's wrong already, what they're missing is time to chase every broken link themselves, and a workflow that recommends the next move with the receipts attached."]}, {"heading": "How it actually works", "paragraphs": ["The setup pairs Amazon Quick with the NVIDIA NeMo Agent Toolkit, connecting structured and unstructured sources like Amazon S3, SharePoint, and Confluence in one conversational workspace.", "Once a supply-chain risk pattern is built, the system walks a planner from the dashboard alert straight to a mitigation recommendation, with 100+ prebuilt connectors executing directly inside Outlook, Slack, and Jira, the whole \"where's the data\" grunt work basically gets outsourced."]}, {"heading": "Why this setup actually matters", "paragraphs": ["The point isn't one more report, it's AI cross-referencing multiple sources on its own and handing back a recommendation with the evidence attached, what used to be a scavenger hunt across systems becomes a structured decision assist instead."]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "The Chart QuickSight Couldn't Draw. Highcharts Stepped In", "card_summary": {"text": "US and UK markets are structurally different animals. QuickSight's native charts couldn't reconcile them, so the team brought in Highcharts for radar and bullet charts instead."}, "stats": [{"value": "49", "label": "US states covered"}, {"value": "7", "label": "Performance categories plotted at once"}], "sources": [{"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/building-multi-region-visualizations-with-highcharts-in-amazon-quick/"}, {"source_name": "AWS ML Blog", "url": "https://aws.amazon.com/blogs/machine-learning/how-couchbase-built-a-multi-model-ai-architecture-for-capella-iq-with-amazon-bedrock/"}], "sections": [{"heading": "One ruler can't measure two different shapes", "paragraphs": ["Once carrier performance data spans the US and UK, standard dashboards simply can't hold both structures at once. The US covers 49 states and hundreds of metros with only three real competitors, while the UK divides nationally with four.", "Different scope, different density, different competitor counts, no off-the-shelf chart tells both stories at once.", "You don't just need to show where things are, you need to answer who's leading, by how much, how stable, and where it's heading. This was never really a charting problem, it's two completely different worlds getting forced onto the same page."]}, {"heading": "Native charts couldn't cut it, Highcharts could", "paragraphs": ["Approximating this with QuickSight's native charting is like measuring a circle and a square with the same ruler, the edges never line up, teams end up spinning up a separate dashboard per region, faking it with stacked bars, or averaging the metric into a single number that erases exactly the volatility between a carrier's best and worst markets.", "The fix was pulling in Highcharts to extend QuickSight, rendering chart types the native tool can't, a radar chart plotting seven carriers across seven categories at once, plus bullet and dumbbell charts, one view, two fundamentally different competitive structures, fully told."]}, {"heading": "What changed", "paragraphs": ["Nobody has to trade data completeness for regional structure anymore, and nobody's duct-taping workarounds together.", "Decision-makers see the full story instead of a partial truth flattened by an average, which is really all a chart is supposed to do in the first place."]}], "delta_insight": null}, {"content_type": "practical", "chosen_headline": "Small Businesses Didn't Wait for an AI Invitation. 58% of Their Staff Are Already Doing Work That Was Impossible a Year Ago", "card_summary": {"text": "27 days of cash on hand, and they're still the ones pulling ahead with AI. 58% of employees are now doing work that simply wasn't possible a year ago."}, "stats": [{"value": "27 days", "label": "Median SMB cash reserve"}, {"value": "58%", "label": "AI users producing work impossible a year ago"}, {"value": "90%", "label": "Share of global businesses that are SMBs"}], "sources": [{"source_name": "Microsoft AI Blog", let currentLang = 'zh-Hant';
const STORAGE_KEY = 'deltaMockStamps:carnival-v2';
let collected = new Set();
try { collected = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch (e) {}
let openSet = new Set();

function renderPara(p) {
  return p.startsWith('<ul') ? p : `<p>${p}</p>`;
}

function renderTopics() {
  const wrap = document.getElementById('topics');
  const topics = TOPICS_BY_LANG[currentLang];
  wrap.innerHTML = topics.map((t, i) => {
    const sectionsHtml = t.sections.map(s => `<div class="topic-section"><span class="run-in">${s.heading}</span>${s.paragraphs.map(renderPara).join('')}</div>`).join('');
    const insightHtml = t.delta_insight ? `<div class="delta-insight"><span class="run-in">${CHROME_I18N[currentLang].insightLabel}</span>${t.delta_insight.paragraphs.map(renderPara).join('')}</div>` : '';
    const sourceHtml = t.sources.map(s => `<a class="btn" href="${s.url}" target="_blank" rel="noopener noreferrer">${s.source_name.toUpperCase()} ↗</a>`).join('');
    const statsHtml = t.stats.map(s => `<div class="stat-tile"><span class="stat-value">${s.value}</span><span class="stat-label">${s.label}</span></div>`).join('');
    const isOpen = openSet.has(i);
    const isCollected = collected.has(i);
    return `
    <article class="topic${isOpen ? ' is-open' : ''}${isCollected ? ' is-collected' : ''}" data-index="${i}">
      <div class="topic-head" data-toggle>
        <span class="stamp-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg></span>
        <h2>${t.chosen_headline}</h2>
        <p class="topic-teaser">${t.card_summary.text}</p>
        <div class="stats-line">${statsHtml}</div>
        <button class="expand-btn" type="button" data-toggle-btn>
          <span>${CHROME_I18N[currentLang].expand}</span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="topic-panel">
        <div class="topic-body">${sectionsHtml}${insightHtml}</div>
        <div class="source-row">
          ${sourceHtml}
          <button class="btn btn--stamp" type="button" data-stamp-btn ${isCollected ? 'disabled' : ''}>
            <span>${isCollected ? CHROME_I18N[currentLang].stamped : CHROME_I18N[currentLang].stamp}</span>
          </button>
        </div>
      </div>
    </article>
    ${i < topics.length - 1 ? `<div class="ornament-row" aria-hidden="true">${i % 2 === 0 ? '❋ ❋ ❋' : '✱ ✱ ✱ ✱'}</div>` : ''}
    `;
  }).join('');

  wrap.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-stamp-btn]')) return;
      const topic = el.closest('.topic');
      const idx = Number(topic.dataset.index);
      topic.classList.toggle('is-open');
      if (openSet.has(idx)) openSet.delete(idx); else openSet.add(idx);
    });
  });
  wrap.querySelectorAll('[data-stamp-btn]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const topic = btn.closest('.topic');
      const idx = Number(topic.dataset.index);
      if (collected.has(idx)) return;
      collect(idx);
    });
  });
}

function collect(i) {
  collected.add(i);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(collected)));
  updateProgress();
  renderTopics();
}
function updateProgress() {
  const topics = TOPICS_BY_LANG[currentLang];
  document.getElementById('progress-count').textContent = CHROME_I18N[currentLang].progress(collected.size);
  document.getElementById('progress-fill').style.width = (collected.size / topics.length * 100) + '%';
}

function applyLang(lang) {
  currentLang = lang;
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('lang-btn-label').textContent = LANG_LABEL[lang];
  document.querySelectorAll('[data-i18n-inline]').forEach(el => {
    el.textContent = CHROME_I18N[lang][el.dataset.i18nInline];
  });
  document.querySelectorAll('.lang-option').forEach(opt => opt.setAttribute('aria-checked', opt.dataset.lang === lang));

  const t = CHROME_I18N[lang];

  /* Build the marquee track from enough repeats of the tagline that a
     single span's rendered width already exceeds the viewport. Two
     identical spans back to back then loop with zero visible seam,
     regardless of how short the base tagline is or how wide the screen is. */
  const marqueeUnit = t.marqueeText + '　·　';
  const marqueeRepeated = marqueeUnit.repeat(6);
  document.getElementById('marquee-span-1').textContent = marqueeRepeated;
  document.getElementById('marquee-span-2').textContent = marqueeRepeated;

  document.getElementById('feedback-fab-label').textContent = t.feedbackBtn;
  document.getElementById('feedback-title').textContent = t.feedbackTitle;
  document.getElementById('feedback-desc').textContent = t.feedbackDesc;
  document.getElementById('feedback-textarea').placeholder = t.feedbackPlaceholder;
  document.getElementById('feedback-cancel').textContent = t.feedbackCancel;
  document.getElementById('feedback-submit-label').textContent = t.feedbackSubmit;
  document.getElementById('feedback-thanks').textContent = t.feedbackThanks;

  updateProgress();
  renderTopics();
}

applyLang('zh-Hant');

const langBtn = document.getElementById('lang-btn');
const langMenu = document.getElementById('lang-menu');
langBtn.addEventListener('click', () => {
  const open = langMenu.classList.toggle('is-open');
  langBtn.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.lang-switcher')) { langMenu.classList.remove('is-open'); langBtn.setAttribute('aria-expanded', 'false'); }
});
langMenu.querySelectorAll('.lang-option').forEach(opt => {
  opt.addEventListener('click', () => { applyLang(opt.dataset.lang); langMenu.classList.remove('is-open'); });
});

/* ---------- feedback FAB: client-side only demo. Real "everyone sees
   everyone's suggestions" needs a backend; this stores locally and shows
   a thank-you, matching the scope agreed on for this mockup pass. ---------- */
const fabBtn = document.getElementById('feedback-fab');
const fbOverlay = document.getElementById('feedback-overlay');
const fbTextarea = document.getElementById('feedback-textarea');
const fbThanks = document.getElementById('feedback-thanks');
const FEEDBACK_KEY = 'deltaMockFeedback:carnival-v3';

function openFeedback() {
  fbOverlay.classList.add('is-open');
  fbThanks.classList.remove('is-visible');
  fbTextarea.value = '';
  fbTextarea.focus();
}
function closeFeedback() { fbOverlay.classList.remove('is-open'); }

fabBtn.addEventListener('click', openFeedback);
document.getElementById('feedback-cancel').addEventListener('click', closeFeedback);
fbOverlay.addEventListener('click', (e) => { if (e.target === fbOverlay) closeFeedback(); });
document.getElementById('feedback-submit').addEventListener('click', () => {
  const text = fbTextarea.value.trim();
  if (!text) { fbTextarea.focus(); return; }
  let stored = [];
  try { stored = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]'); } catch (e) {}
  stored.push({ text, lang: currentLang, at: new Date().toISOString() });
  localStorage.setItem(FEEDBACK_KEY, JSON.stringify(stored));
  fbThanks.classList.add('is-visible');
  fbTextarea.value = '';
  setTimeout(closeFeedback, 1400);
});
</script>
</body>
