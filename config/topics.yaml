# 話題式週報設定（現役的唯一一條 pipeline，依 docs/prd/0731_PRD_v0.5.md 架構建置）
#
# 早期還有另外兩條產品線（趨勢彙整、Delta Pulse 案例式週報），2026-08-13 起
# 凍結搬進 legacy/，設定分別在 legacy/config/domains.yaml 與
# legacy/config/pulse.yaml，不再維護也不再執行，見 legacy/README.md。
#
# 這份設定對應 PRD 的 topic-centric 模型：文章先聚類成「話題」，話題被 18 個
# 模組打分，用組合最佳化選題，寫作素材是話題自己的來源文章。
# 每一道收錄判定的門檻集中在下面的 gates 區塊，判定邏輯在 pipeline/gates.py。

newsletter:
  name: "Delta AI 趨勢日報"
  issue_day: thursday

database:
  path: "data/topics.db"

# 向量庫與聚類：Qdrant 本機 embedded 模式（不需另外跑伺服器），
# collection 存放路徑跟 SQLite pool 分開管理。
vector_store:
  path: "data/qdrant"
  collection: "articles"

embedding:
  model: "Qwen/Qwen3-Embedding-0.6B"
  # 話題聚類門檻：新文章 embedding 對現有話題代表向量的 cosine similarity
  # 超過這個值就併入既有話題，否則新開話題。這是保守預設值，不是正式評測
  # 結果（PRD §6 提到的 20-30 題繁中評測留待之後做，見 docs/status_report）。
  # 目前的來源全部是企業案例（各公司各自的案例，本來就很少是同一事件被
  # 多家媒體報導），預期聚類結果會接近 1 話題 = 1 文章，這是資料特性不是bug。
  cluster_similarity_threshold: 0.72
  # 2026-08-14 加：比對的兩篇裡任一邊只有標題（signal_only）時改用這個較嚴
  # 的門檻。理由：只有標題的短文本 embedding 會塌在一起，實測門檻降到 0.68
  # 就會出現 11 篇互不相關的假合併團塊（8 個 GitHub repo + ChatGPT 新聞 +
  # Ford 新聞）。0.80 是保守起跳值，還沒有評測依據，見 docs/DECISIONS.md。
  # 2026-08-25 起被下面的灰色地帶取代，留著當 same_event_check 關閉時的退路。
  cluster_similarity_threshold_title_only: 0.80
  # 2026-08-25 加：title-only 配對改走灰色地帶問 LLM。19 組固定測資的結論
  # 是門檻切不開（真同事件 0.656~0.847、假配對 0.676~0.833，完全重疊），
  # 實際後果是七個互不相關的 GitHub repo 併成一個話題。邊界依實測分布訂：
  # 低於下界的沒有觀察到真配對、高於上界的沒有觀察到假配對，中間問 LLM
  # （prompts/same_event_check.md，判不出來偏向「不是」）。
  same_event_check:
    lower: 0.65
    upper: 0.85

# 寫作素材怎麼決定。
#
# 2026-08-14 大改，起因是同仁反映「標題跟內容對不上，像硬把幾個來源湊成
# 一篇」。回頭量了已經產出的 26 篇文章、63 篇素材，只有 29 篇（46%）真的
# 屬於它自己的話題，其餘都是從全池檢索補進來的。最離譜的幾組：
#
# | 話題 | 被補進來的素材 |
# |---|---|
# | 公用事業帳單系統阻礙費率創新 | Qwen 3.8-Max 跑分 |
# | McLaren P1 換三倍電池 | 鈉電池、Cambricon 晶片、Moore Threads 上市 |
# | Duke Energy 增資 100 億 | 一個叫 aigclink/geolook 的 GitHub repo |
#
# 第七篇那個組合最後真的寫成了一篇談 AI 跑分的文章，標題跟話題完全無關。
# 模型沒有做錯事：素材給了它五篇不相干的東西，又要求它寫成一篇，它只能
# 找共同點硬接，接出來就是同仁看到的那種文章。
#
# 舊做法的用意是「話題只有一篇文章時補脈絡」，但 reranker 判斷的是主題
# 層級相關（都在講 AI、都在講電力），不是同一件事，補進來的必然是別的
# 事件。所以改成：素材主體一律是話題自己的文章，全池補充預設關掉。
sources_for_writing:
  model: "BAAI/bge-reranker-v2-m3"
  # 話題自己的文章超過這個數量時，用 reranker 排序取前幾篇，避免塞爆
  # context。一般情況遠不會用到，目前 191 個話題有 184 個底下只有一篇。
  max_sources: 5
  # 全池補充。預設關閉，理由見上面那張表。
  #
  # 不是直接把程式碼刪掉，是因為等聚類真的開始合併同事件的多家報導之後，
  # 「補脈絡」這件事本身仍然有價值，屆時可以重新評估後打開。要打開之前
  # 請先用 docs/DECISIONS.md 記的方式量一次補進來的素材有多少比例真的
  # 同事件，不要只看 reranker 分數好看就開。
  supplement:
    enabled: false
    # 只有話題自己的實質文章少於這個數量時才考慮補充
    only_when_own_sources_below: 2
    max_supplements: 1
    retrieval_top_k: 20
    # 補充素材的門檻，刻意比舊的 0.3 高很多。舊值放行了上面表格裡那些
    # 組合，代表 0.3 對「同事件」這個要求來說完全不夠。0.75 是保守起跳
    # 值，不是評測結果，打開這個功能之前要先驗。
    min_relevance: 0.75

# 知識圖譜：Neo4j 存三元組（實體、關係、文章 provenance），連線用的
# NEO4J_URI/USER/PASSWORD 是機密，放在 .env，這裡只放非機密的演算法參數。
graph_store:
  # 實際門檻常數寫在 pipeline/entity_resolution.py（跟 tag_clustering.py
  # 同一種模組內常數的寫法，這裡列出來只是方便對照，不是程式碼實際讀取
  # 的設定來源）。單一門檻切不開「跨語言真同義」跟「字面雷同但不同公司」
  # 這兩種情況（見該檔案 docstring 的實測數字），改成兩段：分數夠低/夠高
  # 直接判定，中間的灰色地帶才問 LLM。
  entity_resolution:
    model: "paraphrase-multilingual-MiniLM-L12-v2"
    grey_zone_lower: 0.15  # 低於此值直接判定不同實體，不花 LLM 額度
    grey_zone_upper: 0.85  # 高於此值直接判定同一實體，不花 LLM 額度
  # Phase 2（PPR 檢索）用，目前先關閉，等圖密度夠了再打開
  ppr:
    enabled: false
    inject_top_k: 5             # 額外注入候選池的文章數上限
    min_entities: 500           # 密度門檻，精神對應 0731 PRD「graph 資料達到密度門檻才納入」的判斷
    min_edges: 1000

# 18 個模組：10 個職能模組 + 8 個領域模組（PRD §2 原文列表）。
# 每個話題會被 LLM 對這 18 個模組各打 0-10 分並附一句理由。
#
# desc 是打分 prompt 實際會看到的模組說明（2026-08-25 加）。在這之前
# prompt 只拿到四個字的模組名，模型只能按字面理解：「消費性產品」被當成
# 「消費性電子新聞」，Dr. Dre 用 AI 做歌拿了 6 分、Meta 智慧眼鏡拿了 9 分，
# 全部從 domain 名額上刊。desc 要寫的是「台達在這塊的事業是什麼、讀者是
# 誰」，讓分數量的是對事業有沒有用，不是主題沾不沾邊。
modules:
  functional:
    - id: legal_compliance
      name: 法務合規
      desc: 台達法務與法遵人員。AI 相關法規（AI Act、資料保護）、合約與智財、生成內容的授權風險，也包含法務工作本身怎麼用 AI（合約審閱、法遵科技、legal tech 平台動態）
    - id: finance_audit
      name: 財會稽核
      desc: 財務、會計與稽核。AI 在財報、費用審核、風險偵測的應用，AI 投資的財務影響
    - id: hr
      name: 人資
      desc: 招募、訓練、績效。AI 在人才流程的應用與勞動法規影響
    - id: marketing_brand
      name: 行銷品牌
      desc: B2B 行銷與品牌。AI 生成內容、市場分析工具，工業品牌的數位溝通
    - id: it_security
      name: 資訊資安
      desc: 企業 IT 與資安。AI 帶來的攻擊面、內部 AI 工具的治理、資料外洩風險
    - id: ops_logistics
      name: 營運物流
      desc: 供應鏈、採購、倉儲物流。AI 在需求預測、供應鏈風險、物流優化的應用
    - id: strategy_investment
      name: 策略投資
      desc: 集團策略與投資。AI 產業的併購、供應鏈變動、競爭格局，對台達本業的機會與威脅
    - id: rd_engineering
      name: 研發工程
      desc: 台達的硬體與韌體研發工程師。AI 輔助設計（EDA、模擬、程式開發）、工程工作流程的 AI 工具
    - id: knowledge_management
      name: 知識管理
      desc: 內部知識庫與文件管理。RAG、企業搜尋、技術文件的 AI 應用
    - id: ehs
      name: EHS
      desc: 環境、職業安全與衛生。AI 在工安監測、危害預防、法規遵循的應用
  domain:
    - id: energy_power
      name: 能源電力
      desc: 台達的電源供應器、資料中心電源與散熱、UPS、儲能系統、太陽能變流器、微電網事業。讀者做電力電子產品與能源基礎設施方案。資料中心用電、電網、儲能相關的 AI 議題是核心
    - id: building_automation
      name: 樓宇自動化
      desc: 台達的樓宇管理系統、空調與 HVAC 控制、廠辦節能事業。智慧建築、樓控系統的 AI 應用是核心
    - id: ev_automotive
      name: 電動車車用
      desc: 台達的電動車動力系統（車載充電器、DC-DC、馬達驅動）、充電樁與車用電子事業。電動車產業動態、充電基礎設施、車用 AI 是核心
    - id: network_infra
      name: 網通基礎設施
      desc: 台達的網通設備、資料中心基礎設施、電信電源事業。AI 算力建設帶動的基礎設施需求是核心
    - id: manufacturing
      name: 製造廠務
      desc: 台達自己的工廠與工業自動化事業。智慧製造、產線自動化、機器視覺檢測、預測性維護、廠務系統的 AI 應用是核心，也包含製造現場用的 AI 硬體與新型技術元件（工業機器人、感測器、邊緣運算裝置）跟用 AI 改善工作流程的做法
    - id: consumer_products
      name: 消費性產品
      desc: 台達的零組件與元件事業（散熱風扇、電源元件、顯示與投影）。量的是對台達產品線的影響。終端裝置的發表、評測、市場故事（穿戴裝置、AI 玩具、手機這類）不屬於這裡，除非內容直接談到電源、散熱、顯示元件的規格或供應鏈
    - id: software_platform
      name: 軟體平台
      desc: 台達自己開發與銷售的工業軟體、物聯網平台、能源管理軟體。量的是對台達軟體產品策略的影響，一般開發者工具或 AI 服務的例行更新不屬於這裡
    - id: sustainability
      name: 永續節能
      desc: 台達的碳管理、ESG、能源效率解決方案事業。AI 資料中心的能耗與減碳、碳盤查工具是核心

content_types:
  - id: insight
    name: 洞見型
  - id: practical
    name: 實用型
  - id: warning
    name: 警示型
  - id: flash
    name: 快訊型

# 收錄判定的門檻。判斷邏輯在 pipeline/gates.py，每個數值怎麼定的寫在
# docs/DECISIONS.md，這裡只放值跟一句話理由。
gates:
  article:
    # 內文短於這個字數的文章只能當「熱度訊號」，不進標籤、不進打分、不當
    # 寫作素材（gate_status='signal_only'）。
    #
    # 2026-08-14 量過池裡 345 篇的內文長度，分布是雙峰的：
    #     0-200 字   149 篇（43%）    200-500 字  21 篇     500 字以上 175 篇
    # 低的那一峰幾乎全是只有標題的 RSS 殘缺內容，依來源看：
    #     DIGITIMES 47/47、Hacker News 30/30、InsideEVs 22/22 全部殘缺，
    #     GitHub 16/18、TechCrunch 23/30、Utility Dive 11/20
    # 最短的六篇只有 11 個字元，就是一行標題。這種東西進到寫作素材裡，
    # 模型除了瞎掰沒有別的選擇，實際上也真的發生了（見 sources_for_writing
    # 的說明）。200 落在兩峰中間的空隙，兩邊都留了餘裕。
    #
    # 標成 signal_only 不是丟掉：這些文章仍然入池、仍然聚類，仍然算進
    # 「幾家在報導同一件事」的熱度訊號，只是不當寫作素材。Hacker News 跟
    # GitHub 這類來源本來的價值就是訊號而不是內文。
    min_content_chars: 200
    # 超過這個天數的文章直接排除。跟 fetch.days_back 一致，來源自己回傳
    # 更舊的東西時擋在這裡。
    max_age_days: 30
    # 標籤階段判定跟 AI 無關就排除。TechCrunch、Hacker News、Slashdot、
    # DIGITIMES 這類綜合性來源本來就會夾帶非 AI 內容，在這條加進來以前
    # 完全沒有人管，全部照收進候選池。
    require_ai_related: true
  topic:
    # 允許單一來源成為一個話題。目前 191 個話題有 184 個底下只有一篇
    # 文章，要求至少兩篇會讓候選池少掉 96%，那不是嚴謹是自廢武功。
    # 改成如實揭露：單一來源的話題會在選題帳跟文章頁標記出來。
    allow_single_source: true
    # 話題底下至少要有幾篇「內文夠長」的文章才能出刊。低於這個數字代表
    # 這個話題只有熱度訊號、沒有可寫的內容。
    min_substantive_articles: 1

# 依出刊頻率（weekly／daily）各自一組配額，compose_topic_issue.py 依
# --cadence 參數選一組。weekly 沿用原本數值不變；daily 是 2026-08-09
# 新增，依 8/1-8/9 實測日均文章量（4-64 篇不等，聚類後話題數接近文章數）
# 縮小版位規模。
#
# tier_cap：企業案例來源（case tier，AWS/Microsoft/Google/NVIDIA 官方
# 部落格）內容同質性高、案例本身帶有廠商行銷角度，讓它不設限主宰版位會讓
# 整期讀起來像單一廠商的業配合輯而不是獨立趨勢週報（2026-08-09 回顧
# 7/27-8/4 七期時發現的問題：16 篇裡有 8 篇集中在案例/工程實務兩類，
# 且案例來源幾乎全是這 4 家）。跟 module_group_quota 一樣，選題邏輯裡
# 超過上限直接跳過候選，只在保底輪（真的湊不滿下限）才不設限。
selection:
  weekly:
    # 2026-08-26 從 [5, 8] 改成固定 10：使用者要求週報固定 10 則。
    total_topics: [10, 10]
    # content_type 配額，某類別缺貨就從別類遞補（配額上限加總要 >= 10）。
    content_type_quota:
      insight: [2, 3]
      practical: [3, 4]
      warning: [0, 2]
      flash: [2, 3]
    # domain（能源電力／樓宇自動化／電動車／網通／製造廠務／消費性產品／
    # 軟體平台／永續節能，台達本業）8 個模組，functional（法務、財會、
    # 人資⋯泛用職能，任何公司都適用）10 個模組。不分群直接輪動的話，
    # functional 模組數量多會先把版位挑光，內容變得像通用生產力工具介紹、
    # 跟本業無關，所以讓 domain 保底過半版位。
    module_group_quota:
      domain: [5, 7]
      functional: [2, 4]
    # 每個模組最多輪動入選幾個話題（避免單一模組的高分話題把版位吃光）。
    per_module_cap: 1
    # 模組輪動這一輪，該模組排名最高的話題分數低於這個值就跳過，不硬湊
    # （分數低代表這一期真的沒有適合這個模組的話題，比湊一則不相關的內容好）。
    # 2026-08-13 從 1.0 調到 4.0。用 189 個話題 × 18 模組共 3402 個分數量過：
    # 1.0 只擋掉 6%，等於形同虛設，選題實際上是純配額驅動而不是品質驅動。
    # 每個話題的最高分都 >= 4.0（中位數 9.5），所以訂 4.0 不會讓任何話題完全
    # 出局，只會讓「這一期真的沒有適合這個模組的內容」時模組輪動直接跳過，
    # 這正是這條門檻原本想做的事。
    # 2026-08-25 從 4.0 調到 6.0，依據是緊縮 prompt 後全池 319 個話題的實測
    # 分布（最高分中位數 8.0）：已知的無關內容（名人動態 2 分、供應商行銷文
    # 5 分）落在 6 以下，真正對台達事業有用的落在 7 以上，6.0 擋掉 14% 最弱
    # 的候選。舊值 4.0 在新分布下只擋 4%，形同虛設。
    min_module_score_to_select: 6.0
    tier_cap:
      case: 4
    # 週度潛力分的三個訊號權重（2026-08-25 加，見 pipeline/topic_selection.py
    # 的 annotate_weekly_potential()）。合成前各訊號先換成名次分位，所以權重
    # 是「訊號之間的相對重要性」不受量綱影響。數字是拍的起始值，沒有評測
    # 依據；模組分佔一半的理由是它畢竟是唯一經過 18 個角度判斷的品質訊號，
    # 另外兩個只是熱度側寫。
    potential_weights:
      module_score: 0.5
      entity_heat: 0.25
      qualified_days: 0.25
  daily:
    # 2026-08-26 改成全收模式：網站以領域為主之後不再固定每天 5 則，門檻
    # 過了就全上（配額輪動整套跳過）。版位配給制下職能類話題永遠搶不過
    # 本業，行銷法務的領域頁一直是空的，這是主因。品質由
    # min_module_score_to_select 把關。
    publish_all_qualified: true
    # 全收模式下 total_topics 只剩下限在用（生成失敗補位的目標），上限無效。
    total_topics: [1, 999]
    # 2026-08-14 加：日報候選池往回多看幾天，不是只看當天。舊行為下昨天
    # 因版位滿落選的話題今天不會再進候選，等於永久淘汰（實測 91.7% 的已
    # 打分話題就這樣消失）。續留窗口內每天重新參選，靠時間衰減自然降權，
    # 過了窗口自然過期。3 天是政策決定（見 PRD §11.4），不是實測值。
    # 2026-08-26 從 3 放寬到 7：使用者要求每天固定 5 則，稀疏的日子先用
    # 窗口內夠格但還沒上刊的話題補滿，比降低門檻硬湊好。
    carry_over_days: 7
    content_type_quota:
      insight: [0, 2]
      practical: [0, 3]
      warning: [0, 2]
      flash: [0, 2]
      warning: [0, 1]
      flash: [0, 1]
    module_group_quota:
      domain: [1, 3]
      functional: [0, 2]
    per_module_cap: 1
    # 2026-08-13 從 1.0 調到 4.0。用 189 個話題 × 18 模組共 3402 個分數量過：
    # 1.0 只擋掉 6%，等於形同虛設，選題實際上是純配額驅動而不是品質驅動。
    # 每個話題的最高分都 >= 4.0（中位數 9.5），所以訂 4.0 不會讓任何話題完全
    # 出局，只會讓「這一期真的沒有適合這個模組的內容」時模組輪動直接跳過，
    # 這正是這條門檻原本想做的事。
    # 2026-08-25 從 4.0 調到 6.0，依據是緊縮 prompt 後全池 319 個話題的實測
    # 分布（最高分中位數 8.0）：已知的無關內容（名人動態 2 分、供應商行銷文
    # 5 分）落在 6 以下，真正對台達事業有用的落在 7 以上，6.0 擋掉 14% 最弱
    # 的候選。舊值 4.0 在新分布下只擋 4%，形同虛設。
    min_module_score_to_select: 6.0
    tier_cap:
      case: 2

# 熱門度評分 = 報導家數 × 來源權重 × 時間衰減。
# time_decay 用半衰期參數化：half_life_days 天後熱度打對折。
# PRD 提到週報看7天、月報看30天、結構性變化看90天，這裡的 window_days
# 是通用參數，週報 script 目前只用 7 天這組。
hotness:
  window_days: 7
  half_life_days: 3.5

quality:
  # 原本只有一個 confidence_threshold 同時管兩件事：要不要回頭重寫、要不要
  # 標記給人工看。2026-08-13 拆成兩個，因為這兩件事的成本差很多：重寫要花
  # LLM 呼叫而且可能改壞，標記給人看是免費的。
  #
  # 拆開的依據是 43 次自檢的實測分布（中位數 0.66）跟重寫前後的變化：
  #     0.78 → 0.66   0.75 → 0.72   0.50 → 0.42     （變差）
  #     0.45 → 0.70   0.40 → 0.54   0.30 → 0.60     （變好）
  # 本來就接近門檻的重寫多半變差，本來很爛的重寫才會變好。舊的 0.8 讓 77%
  # 都去重寫，等於大量在把還可以的文章改爛，還拖慢整批。
  regenerate_below: 0.6      # 低於此值才值得重寫（實測約 33% 會觸發）
  needs_review_below: 0.8    # 低於此值就標記給人工看，維持原本的把關嚴格度
  max_regeneration_retries: 2

fetch:
  days_back: 30
  # 比照 legacy/config/pulse.yaml 對同一批來源已驗證過的規模。
  max_items_per_source: 15

# 來源清單：先沿用 legacy/config/pulse.yaml 裡已實測過的 5 個企業案例來源。
# tier 欄位為 PRD 的三層來源分級（核心層/訊號層/深度層）+ 專門來源類型
# 預留擴充點，目前全部標成 case（企業案例來源），之後要接核心層一般新聞
# 來源或垂直產業來源，補進來源清單並標對 tier 即可，不用改程式碼。
sources:
  # 注意：這個 tag 頁面更新頻率很低（2026-08-10 實測 feed 健康、18 筆解析
  # 正常，但最新一篇是 2026-06-29，往前直接跳到 2025 年），常態性會被
  # fetch.days_back=30 全部濾掉而回傳 0 筆。這是來源特性不是故障，查來源
  # 掛零時不用再查這一個。
  - id: nvidia_customer_stories
    name: "NVIDIA Blog - Customer Stories"
    type: rss
    tier: case
    url: "https://blogs.nvidia.com/blog/tag/customer-stories/feed/"
    weight: 1.0
  - id: ms_ai_customer_stories
    name: "Microsoft AI Blog - Customer Stories"
    type: rss
    tier: case
    url: "https://www.microsoft.com/en-us/ai/blog/content-type/customer-stories/feed/"
    weight: 1.0
  - id: azure_customer_stories
    name: "Azure Blog - Customer Stories"
    type: rss
    tier: case
    url: "https://azure.microsoft.com/en-us/blog/content-type/customer-stories/feed/"
    weight: 0.9
  - id: aws_ml_blog
    name: "AWS Machine Learning Blog"
    type: rss
    tier: case
    url: "https://aws.amazon.com/blogs/machine-learning/feed/"
    weight: 0.8
  - id: google_cloud_blog
    name: "Google Cloud Blog"
    type: rss
    tier: case
    url: "https://cloudblog.withgoogle.com/rss/"
    weight: 0.7

  # 核心層：頂級科技媒體，2026-07-29 加入，各來源已用 curl 驗證過確實
  # 抓得到文章（The Verge、Wired 的 RSS 測起來是空的或太稀疏，先不加）
  - id: techcrunch_ai
    name: "TechCrunch - AI"
    type: rss
    tier: core
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    weight: 1.0
  - id: mit_tech_review_ai
    name: "MIT Technology Review - AI"
    type: rss
    tier: core
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
    weight: 1.0
  - id: ars_technica_ai
    name: "Ars Technica - AI"
    type: rss
    tier: core
    url: "https://arstechnica.com/ai/feed/"
    weight: 0.9
  # 2026-08-10：原本用的 /category/ai/feed/ 已經失效。HTTP 200、XML 也解析
  # 得出來，但整個 feed 只有 7 筆、最新一篇停在 2026-05-19（近三個月前），
  # 不是 VentureBeat 沒發文而是這個分類 feed 被凍住了，所以會安靜地回 0 筆。
  # 改用站台主 feed（實測 7 筆全在 30 天內，最新 2026-08-07）。代價是它不是
  # AI 分類專屬，但實測回傳的 7 篇全部是 AI 題材，VentureBeat 現在的產出本來
  # 就幾乎全是 AI，先接受這個代價；之後若混進太多非 AI 內容再考慮加關鍵字過濾。
  # feeds.feedburner.com/venturebeat/SZYF 實測內容與主 feed 完全相同，不另外加。
  - id: venturebeat_ai
    name: "VentureBeat - AI"
    type: rss
    tier: core
    url: "https://venturebeat.com/feed/"
    weight: 0.9

  # 垂直產業來源：2026-07-29 加入，服務事業單位的產業視角需求，同樣
  # 已用 curl 驗證過（McKinsey、Gartner、Siemens、Schneider Electric、
  # ABB、pv-magazine、Automotive News、Commercial Property Executive
  # 都測過，RSS 不是 404 就是 403，免費路線走不通，先不加）
  - id: digitimes_daily
    name: "DIGITIMES"
    type: rss
    tier: vertical
    url: "https://www.digitimes.com/rss/daily.xml"
    weight: 0.8
  - id: utility_dive
    name: "Utility Dive"
    type: rss
    tier: vertical
    url: "https://www.utilitydive.com/feeds/news/"
    weight: 0.7
  - id: insideevs
    name: "InsideEVs"
    type: rss
    tier: vertical
    url: "https://insideevs.com/rss/articles/all/"
    weight: 0.7

  # 深度層：arXiv 官方 API，免費、不需金鑰，抓取程式本來就已經存在
  # （ingestion/arxiv_source.py，原本給趨勢彙整那條 pipeline 用），這裡是
  # 第一次接進話題式週報。keywords 只影響 score 排序，不影響是否抓到。
  - id: arxiv_ai
    name: "arXiv (cs.AI / cs.CL / cs.LG)"
    type: arxiv
    tier: depth
    categories: ["cs.AI", "cs.CL", "cs.LG"]
    keywords: ["enterprise", "production", "deployment", "industry", "benchmark"]
    weight: 0.6

  # 訊號層：Hacker News，透過 Algolia 公開搜尋 API，免費、不需金鑰。
  # min_points 過濾掉討論度太低的貼文，降低雜訊。
  - id: hn_ai
    name: "Hacker News"
    type: hn
    tier: signal
    # Algolia 的 query 是全文比對不是布林查詢，要涵蓋多個關鍵字要分開列，
    # 不能塞 "A OR B" 這種字串（詳見 ingestion/hn_source.py 的說明）
    queries: ["AI", "LLM", "artificial intelligence"]
    min_points: 20
    weight: 0.6

  # 訊號層：Reddit，走官方 OAuth（PRAW），需要 .env 裡的 REDDIT_CLIENT_ID /
  # REDDIT_CLIENT_SECRET / REDDIT_USER_AGENT，目前這三個環境變數是空的，
  # 沒填之前 fetch_reddit_items() 會印警告並回傳空列表，不會讓整批中斷。
  - id: reddit_ai
    name: "Reddit (r/artificial, r/MachineLearning, r/mcp)"
    type: reddit
    tier: signal
    # r/mcp 是 2026-07-29 加的，社群討論 MCP（Model Context Protocol）跟
    # skill 實際怎麼用/踩什麼雷，比 HN 對這個主題的搜尋量高很多（HN 30 天
    # 內查 "MCP model context protocol" 幾乎是 0 篇，已測過，先不加 HN 查詢）
    subreddits: ["artificial", "MachineLearning", "mcp"]
    weight: 0.5

  # 訊號層：Slashdot，老牌科技社群新聞聚合站，RSS 格式是 RDF（跟一般
  # RSS 2.0 長得不太一樣），feedparser 可以正常處理，已驗證抓得到內容。
  - id: slashdot
    name: "Slashdot"
    type: rss
    tier: signal
    url: "https://rss.slashdot.org/Slashdot/slashdotMain"
    weight: 0.5

  # 訊號層：Stack Overflow，官方 API 不需金鑰，用來看開發者實際踩到的
  # AI/LLM 相關技術問題，是「怎麼用、踩什麼雷」最直接的訊號來源之一。
  #
  # 2026-08-10 修過一輪，起因是這個來源穩定回傳 0 筆但不報錯。查下去發現
  # 兩個獨立問題，程式面那個修在 ingestion/stackexchange_source.py（sort 用
  # activity 但 cutoff 比 creation_date，欄位不一致）；設定面就是下面這兩項：
  #
  # tags：原本三個 tag 近 30 天的發問量實測是 2 / 0 / 0 筆，光修 sort 救不
  # 回來。量過十四個候選 tag 後換成下面這組，近 30 天發問量分別是
  # pytorch 5、machine-learning 4、rag 3、langchain 3、large-language-model 2、
  # huggingface-transformers 2、vector-database 2。openai-api（最新發問停在
  # 2026-06-25）、artificial-intelligence（2026-07-07）、chatgpt-api
  # （2025-12-18）、llama（2026-04-07）、embedding（2026-07-06）都已經沒量，
  # anthropic-claude 這個 tag 根本不存在，全部拿掉。
  #
  # min_score：從 1 降到 0。Stack Overflow 的分數是慢慢累積的，新問題幾乎
  # 都還是 0 分，用 >=1 篩等於把「近期」跟「有分數」這兩個互斥條件疊在一起，
  # 實測會把上面那組 tag 的 21 筆再砍到只剩 6 筆。改成 >=0 的語意是「只擋掉
  # 被倒讚的問題」，這才是原本想要的雜訊過濾。
  #
  # 即使兩項都改完，這個來源的預期產出仍然只有個位數（LLM 普及之後 Stack
  # Overflow 的發問量本來就大幅萎縮），定位當補充訊號、不要期待它撐版位。
  - id: stackoverflow_ai
    name: "Stack Overflow (AI/LLM tags)"
    type: stackexchange
    tier: signal
    site: stackoverflow
    tags: ["rag", "langchain", "large-language-model", "huggingface-transformers", "vector-database", "pytorch", "machine-learning"]
    min_score: 0
    weight: 0.5

  # 訊號層：GitHub，官方 Search API 不需金鑰，抓近期建立、star 數成長快的
  # repo，用來偵測「開發者實際在用什麼工具/框架」的早期訊號，跟今天想追蹤
  # 的 MCP 討論也對得上（query 直接搜 "mcp" topic）。
  - id: github_trending_ai
    name: "GitHub (trending AI/MCP repos)"
    type: github
    tier: signal
    queries: ["topic:llm", "topic:mcp", "topic:agent"]
    min_stars: 20
    weight: 0.5

  # 2026-08-26 擴充：補主管點名的缺口（製造硬體、法務科技、台灣、中國）。
  # 全部走同一套收錄關卡，非 AI 內容會被 is_ai_related 判定濾掉，所以綜合
  # 媒體可以放心收。候選裡 Robot Report 擋爬蟲(403)、機器之心與 36氪的
  # feed 非標準格式，驗證過不可用，沒收。
  - id: ieee_spectrum_robotics
    name: "IEEE Spectrum (Robotics)"
    type: rss
    tier: vertical
    url: "https://spectrum.ieee.org/feeds/topic/robotics.rss"
    weight: 0.9
  - id: hackaday
    name: "Hackaday"
    type: rss
    tier: signal
    url: "https://hackaday.com/feed/"
    weight: 0.7
  - id: artificial_lawyer
    name: "Artificial Lawyer"
    type: rss
    tier: vertical
    url: "https://www.artificiallawyer.com/feed/"
    weight: 0.9
  - id: lawsites
    name: "LawSites"
    type: rss
    tier: vertical
    url: "https://www.lawsitesblog.com/feed/"
    weight: 0.8
  - id: ithome_tw
    name: "iThome"
    type: rss
    tier: core
    url: "https://www.ithome.com.tw/rss"
    weight: 0.9
  - id: technews_tw
    name: "TechNews 科技新報"
    type: rss
    tier: core
    url: "https://technews.tw/feed/"
    weight: 0.9
  - id: inside_tw
    name: "INSIDE"
    type: rss
    tier: core
    url: "https://www.inside.com.tw/feed/rss"
    weight: 0.9
