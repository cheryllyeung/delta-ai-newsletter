# 話題式週報設定（第三條 pipeline，依 docs/0724_v3_PRD.md 架構建置）
#
# 跟 config/domains.yaml（趨勢彙整）、config/pulse.yaml（Delta Pulse 案例式週報）
# 是三條獨立產品線，互不影響，只共用 ingestion/base.py 的 RawItem 格式跟
# pipeline/llm_client.py 等底層元件。
#
# 這份設定對應 PRD 的 topic-centric 模型：文章先聚類成「話題」，話題被 18 個
# 模組打分，用組合最佳化選題，寫作時用 embedding+reranker 兩段式檢索素材。

newsletter:
  name: "Delta AI 趨勢週報"
  issue_day: thursday

database:
  path: "data/topics.db"

# 向量庫與聚類：Qdrant 本機 embedded 模式（不需另外跑伺服器），
# collection 存放路徑跟 SQLite pool 分開管理。
vector_store:
  path: "data/qdrant"
  collection: "articles"

embedding:
  model: "Qwen/Qwen3-Embedding-0.6B"
  # 話題聚類門檻：新文章 embedding 對現有話題代表向量的 cosine similarity
  # 超過這個值就併入既有話題，否則新開話題。這是保守預設值，不是正式評測
  # 結果（PRD §6 提到的 20-30 題繁中評測留待之後做，見 docs/status_report）。
  # 目前的來源全部是企業案例（各公司各自的案例，本來就很少是同一事件被
  # 多家媒體報導），預期聚類結果會接近 1 話題 = 1 文章，這是資料特性不是bug。
  cluster_similarity_threshold: 0.72

reranker:
  model: "BAAI/bge-reranker-v2-m3"
  retrieval_top_k: 20     # 第一段：embedding 從全池撈 top-20
  rerank_top_k: 2          # 第二段：reranker 重排取 top-2 作為寫作素材（暫時調小：
                            # Groq 免費層 TPM 上限 8000，5 篇來源全文會爆量，見 .env 註解）

# 知識圖譜：Neo4j 存三元組（實體、關係、文章 provenance），連線用的
# NEO4J_URI/USER/PASSWORD 是機密，放在 .env，這裡只放非機密的演算法參數。
graph_store:
  # 實際門檻常數寫在 pipeline/entity_resolution.py（跟 tag_clustering.py
  # 同一種模組內常數的寫法，這裡列出來只是方便對照，不是程式碼實際讀取
  # 的設定來源）。單一門檻切不開「跨語言真同義」跟「字面雷同但不同公司」
  # 這兩種情況（見該檔案 docstring 的實測數字），改成兩段：分數夠低/夠高
  # 直接判定，中間的灰色地帶才問 LLM。
  entity_resolution:
    model: "paraphrase-multilingual-MiniLM-L12-v2"
    grey_zone_lower: 0.15  # 低於此值直接判定不同實體，不花 LLM 額度
    grey_zone_upper: 0.85  # 高於此值直接判定同一實體，不花 LLM 額度
  # Phase 2（PPR 檢索）用，目前先關閉，等圖密度夠了再打開
  ppr:
    enabled: false
    inject_top_k: 5             # 額外注入候選池的文章數上限
    min_entities: 500           # 密度門檻，精神對應 0731 PRD「graph 資料達到密度門檻才納入」的判斷
    min_edges: 1000

# 18 個模組：10 個職能模組 + 8 個領域模組（PRD §2 原文列表）。
# 每個話題會被 LLM 對這 18 個模組各打 0-10 分並附一句理由。
modules:
  functional:
    - id: legal_compliance
      name: 法務合規
    - id: finance_audit
      name: 財會稽核
    - id: hr
      name: 人資
    - id: marketing_brand
      name: 行銷品牌
    - id: it_security
      name: 資訊資安
    - id: ops_logistics
      name: 營運物流
    - id: strategy_investment
      name: 策略投資
    - id: rd_engineering
      name: 研發工程
    - id: knowledge_management
      name: 知識管理
    - id: ehs
      name: EHS
  domain:
    - id: energy_power
      name: 能源電力
    - id: building_automation
      name: 樓宇自動化
    - id: ev_automotive
      name: 電動車車用
    - id: network_infra
      name: 網通基礎設施
    - id: manufacturing
      name: 製造廠務
    - id: consumer_products
      name: 消費性產品
    - id: software_platform
      name: 軟體平台
    - id: sustainability
      name: 永續節能

content_types:
  - id: insight
    name: 洞見型
  - id: practical
    name: 實用型
  - id: warning
    name: 警示型
  - id: flash
    name: 快訊型

# 依出刊頻率（weekly／daily）各自一組配額，compose_topic_issue.py 依
# --cadence 參數選一組。weekly 沿用原本數值不變；daily 是 2026-08-09
# 新增，依 8/1-8/9 實測日均文章量（4-64 篇不等，聚類後話題數接近文章數）
# 縮小版位規模。
#
# tier_cap：企業案例來源（case tier，AWS/Microsoft/Google/NVIDIA 官方
# 部落格）內容同質性高、案例本身帶有廠商行銷角度，讓它不設限主宰版位會讓
# 整期讀起來像單一廠商的業配合輯而不是獨立趨勢週報（2026-08-09 回顧
# 7/27-8/4 七期時發現的問題：16 篇裡有 8 篇集中在案例/工程實務兩類，
# 且案例來源幾乎全是這 4 家）。跟 module_group_quota 一樣，選題邏輯裡
# 超過上限直接跳過候選，只在保底輪（真的湊不滿下限）才不設限。
selection:
  weekly:
    total_topics: [5, 8]
    # content_type 配額，某類別缺貨就從別類遞補，不硬湊（比照 pool_selection.py 的 area_quota 寫法）。
    content_type_quota:
      insight: [1, 2]
      practical: [2, 3]
      warning: [0, 1]
      flash: [1, 2]
    # domain（能源電力／樓宇自動化／電動車／網通／製造廠務／消費性產品／
    # 軟體平台／永續節能，台達本業）8 個模組，functional（法務、財會、
    # 人資⋯泛用職能，任何公司都適用）10 個模組。不分群直接輪動的話，
    # functional 模組數量多會先把版位挑光，內容變得像通用生產力工具介紹、
    # 跟本業無關，所以讓 domain 保底過半版位。
    module_group_quota:
      domain: [4, 6]
      functional: [1, 3]
    # 每個模組最多輪動入選幾個話題（避免單一模組的高分話題把版位吃光）。
    per_module_cap: 1
    # 模組輪動這一輪，該模組排名最高的話題分數低於這個值就跳過，不硬湊
    # （分數低代表這一期真的沒有適合這個模組的話題，比湊一則不相關的內容好）。
    min_module_score_to_select: 1.0
    tier_cap:
      case: 3
  daily:
    total_topics: [2, 5]
    content_type_quota:
      insight: [0, 1]
      practical: [0, 2]
      warning: [0, 1]
      flash: [0, 1]
    module_group_quota:
      domain: [1, 3]
      functional: [0, 2]
    per_module_cap: 1
    min_module_score_to_select: 1.0
    tier_cap:
      case: 1

# 熱門度評分 = 報導家數 × 來源權重 × 時間衰減。
# time_decay 用半衰期參數化：half_life_days 天後熱度打對折。
# PRD 提到週報看7天、月報看30天、結構性變化看90天，這裡的 window_days
# 是通用參數，週報 script 目前只用 7 天這組。
hotness:
  window_days: 7
  half_life_days: 3.5

quality:
  confidence_threshold: 0.8
  max_regeneration_retries: 2

fetch:
  days_back: 30
  # 比照 config/pulse.yaml 對同一批來源已驗證過的規模。
  max_items_per_source: 15

# 來源清單：先沿用 config/pulse.yaml 裡已實測過的 5 個企業案例來源。
# tier 欄位為 PRD 的三層來源分級（核心層/訊號層/深度層）+ 專門來源類型
# 預留擴充點，目前全部標成 case（企業案例來源），之後要接核心層一般新聞
# 來源或垂直產業來源，補進來源清單並標對 tier 即可，不用改程式碼。
sources:
  # 注意：這個 tag 頁面更新頻率很低（2026-08-10 實測 feed 健康、18 筆解析
  # 正常，但最新一篇是 2026-06-29，往前直接跳到 2025 年），常態性會被
  # fetch.days_back=30 全部濾掉而回傳 0 筆。這是來源特性不是故障，查來源
  # 掛零時不用再查這一個。
  - id: nvidia_customer_stories
    name: "NVIDIA Blog - Customer Stories"
    type: rss
    tier: case
    url: "https://blogs.nvidia.com/blog/tag/customer-stories/feed/"
    weight: 1.0
  - id: ms_ai_customer_stories
    name: "Microsoft AI Blog - Customer Stories"
    type: rss
    tier: case
    url: "https://www.microsoft.com/en-us/ai/blog/content-type/customer-stories/feed/"
    weight: 1.0
  - id: azure_customer_stories
    name: "Azure Blog - Customer Stories"
    type: rss
    tier: case
    url: "https://azure.microsoft.com/en-us/blog/content-type/customer-stories/feed/"
    weight: 0.9
  - id: aws_ml_blog
    name: "AWS Machine Learning Blog"
    type: rss
    tier: case
    url: "https://aws.amazon.com/blogs/machine-learning/feed/"
    weight: 0.8
  - id: google_cloud_blog
    name: "Google Cloud Blog"
    type: rss
    tier: case
    url: "https://cloudblog.withgoogle.com/rss/"
    weight: 0.7

  # 核心層：頂級科技媒體，2026-07-29 加入，各來源已用 curl 驗證過確實
  # 抓得到文章（The Verge、Wired 的 RSS 測起來是空的或太稀疏，先不加）
  - id: techcrunch_ai
    name: "TechCrunch - AI"
    type: rss
    tier: core
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    weight: 1.0
  - id: mit_tech_review_ai
    name: "MIT Technology Review - AI"
    type: rss
    tier: core
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
    weight: 1.0
  - id: ars_technica_ai
    name: "Ars Technica - AI"
    type: rss
    tier: core
    url: "https://arstechnica.com/ai/feed/"
    weight: 0.9
  # 2026-08-10：原本用的 /category/ai/feed/ 已經失效——HTTP 200、XML 也解析
  # 得出來，但整個 feed 只有 7 筆、最新一篇停在 2026-05-19（近三個月前），
  # 不是 VentureBeat 沒發文而是這個分類 feed 被凍住了，所以會安靜地回 0 筆。
  # 改用站台主 feed（實測 7 筆全在 30 天內，最新 2026-08-07）。代價是它不是
  # AI 分類專屬，但實測回傳的 7 篇全部是 AI 題材，VentureBeat 現在的產出本來
  # 就幾乎全是 AI，先接受這個代價；之後若混進太多非 AI 內容再考慮加關鍵字過濾。
  # feeds.feedburner.com/venturebeat/SZYF 實測內容與主 feed 完全相同，不另外加。
  - id: venturebeat_ai
    name: "VentureBeat - AI"
    type: rss
    tier: core
    url: "https://venturebeat.com/feed/"
    weight: 0.9

  # 垂直產業來源：2026-07-29 加入，服務事業單位的產業視角需求，同樣
  # 已用 curl 驗證過（McKinsey、Gartner、Siemens、Schneider Electric、
  # ABB、pv-magazine、Automotive News、Commercial Property Executive
  # 都測過，RSS 不是 404 就是 403，免費路線走不通，先不加）
  - id: digitimes_daily
    name: "DIGITIMES"
    type: rss
    tier: vertical
    url: "https://www.digitimes.com/rss/daily.xml"
    weight: 0.8
  - id: utility_dive
    name: "Utility Dive"
    type: rss
    tier: vertical
    url: "https://www.utilitydive.com/feeds/news/"
    weight: 0.7
  - id: insideevs
    name: "InsideEVs"
    type: rss
    tier: vertical
    url: "https://insideevs.com/rss/articles/all/"
    weight: 0.7

  # 深度層：arXiv 官方 API，免費、不需金鑰，抓取程式本來就已經存在
  # （ingestion/arxiv_source.py，原本給趨勢彙整那條 pipeline 用），這裡是
  # 第一次接進話題式週報。keywords 只影響 score 排序，不影響是否抓到。
  - id: arxiv_ai
    name: "arXiv (cs.AI / cs.CL / cs.LG)"
    type: arxiv
    tier: depth
    categories: ["cs.AI", "cs.CL", "cs.LG"]
    keywords: ["enterprise", "production", "deployment", "industry", "benchmark"]
    weight: 0.6

  # 訊號層：Hacker News，透過 Algolia 公開搜尋 API，免費、不需金鑰。
  # min_points 過濾掉討論度太低的貼文，降低雜訊。
  - id: hn_ai
    name: "Hacker News"
    type: hn
    tier: signal
    # Algolia 的 query 是全文比對不是布林查詢，要涵蓋多個關鍵字要分開列，
    # 不能塞 "A OR B" 這種字串（詳見 ingestion/hn_source.py 的說明）
    queries: ["AI", "LLM", "artificial intelligence"]
    min_points: 20
    weight: 0.6

  # 訊號層：Reddit，走官方 OAuth（PRAW），需要 .env 裡的 REDDIT_CLIENT_ID /
  # REDDIT_CLIENT_SECRET / REDDIT_USER_AGENT，目前這三個環境變數是空的，
  # 沒填之前 fetch_reddit_items() 會印警告並回傳空列表，不會讓整批中斷。
  - id: reddit_ai
    name: "Reddit (r/artificial, r/MachineLearning, r/mcp)"
    type: reddit
    tier: signal
    # r/mcp 是 2026-07-29 加的，社群討論 MCP（Model Context Protocol）跟
    # skill 實際怎麼用/踩什麼雷，比 HN 對這個主題的搜尋量高很多（HN 30 天
    # 內查 "MCP model context protocol" 幾乎是 0 篇，已測過，先不加 HN 查詢）
    subreddits: ["artificial", "MachineLearning", "mcp"]
    weight: 0.5

  # 訊號層：Slashdot，老牌科技社群新聞聚合站，RSS 格式是 RDF（跟一般
  # RSS 2.0 長得不太一樣），feedparser 可以正常處理，已驗證抓得到內容。
  - id: slashdot
    name: "Slashdot"
    type: rss
    tier: signal
    url: "https://rss.slashdot.org/Slashdot/slashdotMain"
    weight: 0.5

  # 訊號層：Stack Overflow，官方 API 不需金鑰，用來看開發者實際踩到的
  # AI/LLM 相關技術問題，是「怎麼用、踩什麼雷」最直接的訊號來源之一。
  #
  # 2026-08-10 修過一輪，起因是這個來源穩定回傳 0 筆但不報錯。查下去發現
  # 兩個獨立問題，程式面那個修在 ingestion/stackexchange_source.py（sort 用
  # activity 但 cutoff 比 creation_date，欄位不一致）；設定面就是下面這兩項：
  #
  # tags：原本三個 tag 近 30 天的發問量實測是 2 / 0 / 0 筆，光修 sort 救不
  # 回來。量過十四個候選 tag 後換成下面這組，近 30 天發問量分別是
  # pytorch 5、machine-learning 4、rag 3、langchain 3、large-language-model 2、
  # huggingface-transformers 2、vector-database 2。openai-api（最新發問停在
  # 2026-06-25）、artificial-intelligence（2026-07-07）、chatgpt-api
  # （2025-12-18）、llama（2026-04-07）、embedding（2026-07-06）都已經沒量，
  # anthropic-claude 這個 tag 根本不存在，全部拿掉。
  #
  # min_score：從 1 降到 0。Stack Overflow 的分數是慢慢累積的，新問題幾乎
  # 都還是 0 分，用 >=1 篩等於把「近期」跟「有分數」這兩個互斥條件疊在一起，
  # 實測會把上面那組 tag 的 21 筆再砍到只剩 6 筆。改成 >=0 的語意是「只擋掉
  # 被倒讚的問題」，這才是原本想要的雜訊過濾。
  #
  # 即使兩項都改完，這個來源的預期產出仍然只有個位數（LLM 普及之後 Stack
  # Overflow 的發問量本來就大幅萎縮），定位當補充訊號、不要期待它撐版位。
  - id: stackoverflow_ai
    name: "Stack Overflow (AI/LLM tags)"
    type: stackexchange
    tier: signal
    site: stackoverflow
    tags: ["rag", "langchain", "large-language-model", "huggingface-transformers", "vector-database", "pytorch", "machine-learning"]
    min_score: 0
    weight: 0.5

  # 訊號層：GitHub，官方 Search API 不需金鑰，抓近期建立、star 數成長快的
  # repo，用來偵測「開發者實際在用什麼工具/框架」的早期訊號，跟今天想追蹤
  # 的 MCP 討論也對得上（query 直接搜 "mcp" topic）。
  - id: github_trending_ai
    name: "GitHub (trending AI/MCP repos)"
    type: github
    tier: signal
    queries: ["topic:llm", "topic:mcp", "topic:agent"]
    min_stars: 20
    weight: 0.5
